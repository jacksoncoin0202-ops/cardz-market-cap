name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
      - "agent/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARDZ_NETWORK_COLLECTION_DISABLED: "1"
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout without private LFS payloads
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Configure LFS and fetch public assets only
        shell: bash
        run: |
          git lfs install --local
          git lfs fsck --pointers HEAD
          git lfs pull --exclude="data/private/**"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Install pipeline verification dependencies
        run: python -m pip install -r pipelines/requirements.txt

      - name: Verify public boundary and seed structure
        run: npm run verify:public -- --allow-demo

      - name: Verify deployment isolation
        run: npm run verify:deployment

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Data contract tests
        run: npm run test:data

      - name: Image manifest gate
        run: npm run images:verify

      - name: Build Cloudflare Worker application
        run: npm run build:cloudflare

      - name: Verify public build output
        run: npm run verify:public -- --allow-demo --require-build

      - name: Validate staging Worker bundle without deploying
        run: npx wrangler deploy --dry-run --env staging --config apps/web/wrangler.jsonc --outdir data/runtime/wrangler-staging

      - name: Confirm private history was not downloaded
        shell: bash
        run: |
          if find data/private -type f ! -name '.gitkeep' -size +1024c -print -quit | grep -q .; then
            echo "Private LFS payloads must not be materialized in GitHub Actions."
            exit 1
          fi
