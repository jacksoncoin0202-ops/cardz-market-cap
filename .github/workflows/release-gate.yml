name: Production release gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-production-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARDZ_NETWORK_COLLECTION_DISABLED: "1"
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout without private LFS payloads
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Fetch public LFS assets only
        shell: bash
        run: |
          git lfs install --local
          git lfs pull --exclude="data/private/**"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build and run strict release gate
        run: npm run verify:release

      - name: Validate production Worker bundle without deploying
        run: npx wrangler deploy --dry-run --env production --config apps/web/wrangler.jsonc --outdir data/runtime/wrangler-production

      - name: Confirm no private history was materialized
        shell: bash
        run: |
          if find data/private -type f ! -name '.gitkeep' -size +1024c -print -quit | grep -q .; then
            echo "Private LFS payloads must not be materialized in the release gate."
            exit 1
          fi
