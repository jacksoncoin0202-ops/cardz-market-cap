<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CARDZ Market Cap — Heatmap Concepts</title>
<style>
  :root {
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-spring: cubic-bezier(0.32, 0.72, 0, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    font-variant-numeric: tabular-nums;
    overflow: hidden;
    transition: background-color 0.5s var(--ease-out);
  }

  /* ============ switcher ============ */
  .switcher {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    z-index: 100; display: flex; gap: 6px; padding: 5px; border-radius: 999px;
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    transition: background 0.5s, box-shadow 0.5s;
  }
  .switcher button {
    border: 0; cursor: pointer; font: inherit; font-size: 13px; font-weight: 600;
    padding: 8px 18px; border-radius: 999px; letter-spacing: 0.02em;
    transition: all 0.25s var(--ease-out);
  }
  body[data-theme="gallery"] { background: #F2F1EC; }
  body[data-theme="gallery"] .switcher { background: rgba(255,255,255,0.78); box-shadow: 0 2px 16px rgba(30,30,30,0.12); }
  body[data-theme="gallery"] .switcher button { background: transparent; color: #6B6B66; }
  body[data-theme="gallery"] .switcher button.active { background: #1A1A18; color: #F2F1EC; }
  body[data-mode="day"] .switcher button[data-theme="gallery"],
  body[data-mode="dark"] .switcher button[data-theme="vault"] { text-decoration: underline; text-underline-offset: 4px; }

  body[data-theme="vault"] { background: #0A0C10; }
  body[data-theme="vault"] .switcher { background: rgba(20,24,32,0.72); box-shadow: 0 2px 24px rgba(0,0,0,0.6); }
  body[data-theme="vault"] .switcher button { background: transparent; color: #5E6673; }
  body[data-theme="vault"] .switcher button.active { background: #E8EAF0; color: #0A0C10; }

  body[data-theme="holo"] { background: #0E1016; }
  body[data-theme="holo"] .switcher { background: rgba(24,26,36,0.68); box-shadow: 0 2px 24px rgba(0,0,0,0.55); }
  body[data-theme="holo"] .switcher button { background: transparent; color: #7A7F92; }
  body[data-theme="holo"] .switcher button.active { background: linear-gradient(110deg, #B9C6FF, #F3C6FF, #C6F0FF); color: #14151F; }

  /* ============ period switcher ============ */
  .period-switcher {
    position: fixed; top: 16px; left: 24px;
    z-index: 100; display: flex; gap: 2px; padding: 4px; border-radius: 8px;
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    transition: background 0.5s, box-shadow 0.5s;
  }
  .period-switcher button {
    border: 0; cursor: pointer; font: inherit; font-size: 12px; font-weight: 700;
    padding: 7px 14px; border-radius: 5px; letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
    transition: all 0.2s var(--ease-out);
  }
  body[data-theme="gallery"] .period-switcher { background: rgba(255,255,255,0.78); box-shadow: 0 2px 16px rgba(30,30,30,0.10); }
  body[data-theme="gallery"] .period-switcher button { background: transparent; color: #8A887F; }
  body[data-theme="gallery"] .period-switcher button.active { background: #1A1A18; color: #FFD54A; }
  body[data-theme="vault"] .period-switcher, body[data-theme="holo"] .period-switcher { background: rgba(20,24,32,0.72); box-shadow: 0 2px 24px rgba(0,0,0,0.5); }
  body[data-theme="vault"] .period-switcher button, body[data-theme="holo"] .period-switcher button { background: transparent; color: #5E6673; }
  body[data-theme="vault"] .period-switcher button.active, body[data-theme="holo"] .period-switcher button.active { background: #E8EAF0; color: #0A0C10; }
  .period-switcher button:disabled { opacity: 0.35; cursor: default; }
  .period-note {
    position: fixed; top: 58px; left: 28px; z-index: 100; margin: 0;
    font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
  }
  body[data-theme="gallery"] .period-note { color: rgba(26,26,24,0.45); }
  body[data-theme="vault"] .period-note, body[data-theme="holo"] .period-note { color: rgba(232,234,240,0.4); }

  /* ============ share button ============ */
  .share-btn {
    position: fixed; top: 20px; right: 24px; z-index: 100;
    border: 0; cursor: pointer; font: inherit; font-size: 13px; font-weight: 700;
    padding: 10px 20px; border-radius: 999px; letter-spacing: 0.02em;
    transition: all 0.25s var(--ease-out);
    display: flex; align-items: center; gap: 8px;
  }
  body[data-theme="gallery"] .share-btn { background: #1A1A18; color: #F2F1EC; }
  body[data-theme="vault"] .share-btn, body[data-theme="holo"] .share-btn { background: #E8EAF0; color: #0A0C10; }
  .share-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(0,0,0,0.25); }
  .share-btn:disabled { opacity: 0.5; cursor: wait; }

  .hint {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    z-index: 100; font-size: 12px; letter-spacing: 0.04em; opacity: 0.55; pointer-events: none;
  }
  body[data-theme="gallery"] .hint { color: #55554F; }
  body[data-theme="vault"] .hint, body[data-theme="holo"] .hint { color: #AAB0C0; }

  /* ============ stage ============ */
  #stage { position: absolute; inset: 72px 24px 40px 24px; }
  .tile {
    position: absolute; overflow: hidden; cursor: pointer;
    transition: opacity 0.22s var(--ease-out), transform 0.2s var(--ease-out),
                box-shadow 0.22s var(--ease-out), filter 0.25s var(--ease-out);
    will-change: transform;
  }
  .tile img {
    position: absolute; inset: var(--gap-inset, 1px); width: calc(100% - var(--gap-inset, 1px) * 2); height: calc(100% - var(--gap-inset, 1px) * 2);
    object-fit: cover; object-position: center 22%;
    pointer-events: none;
    filter: blur(var(--card-blur, 0px));
  }
  /* 極致色塊：升 = 純綠、跌 = 純紅，0% = 微灰。同 img 一樣留縫。 */
  .tile .tint { position: absolute; inset: var(--gap-inset, 1px); pointer-events: none; z-index: 2; }

  /* ---- 頭 N 大 tile 嘅升跌角標（左下角，黃字） ---- */
  .tile .bigpct {
    position: absolute; left: 6px; bottom: 6px; z-index: 4; pointer-events: none;
    font-size: 13px; font-weight: 800; letter-spacing: 0.01em;
    font-variant-numeric: tabular-nums; color: #FFD54A;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85), 0 0 12px rgba(0, 0, 0, 0.5);
  }

  /* spotlight：hover 時全場調暗，得嗰隻卡浮出 */
  #stage:hover .tile:not(:hover),
  #stage:focus-within .tile:not(:hover):not(:focus-visible) {
    opacity: 0.30; filter: saturate(0.35) brightness(0.72);
  }
  .tile:hover, .tile:focus-visible { z-index: 8; }

  /* ---- gallery ---- */
  body[data-theme="gallery"] .tile { background: transparent; border-radius: 0; }
  body[data-theme="gallery"] .tile:hover, body[data-theme="gallery"] .tile:focus-visible {
    transform: scale(1.07); box-shadow: 0 18px 48px rgba(40,38,32,0.4);
  }
  /* ---- vault ---- */
  body[data-theme="vault"] .tile { background: #11141B; border-radius: 4px; }
  body[data-theme="vault"] .tile::before {
    content: ""; position: absolute; inset: 0; border-radius: 4px; z-index: 3; pointer-events: none;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
  }
  body[data-theme="vault"] .tile:hover, body[data-theme="vault"] .tile:focus-visible {
    transform: scale(1.07); box-shadow: 0 22px 60px rgba(0,0,0,0.85), 0 0 44px var(--glow-soft, transparent);
  }
  /* ---- holo ---- */
  body[data-theme="holo"] .tile { background: #161923; border-radius: 5px; transform-style: preserve-3d; }
  body[data-theme="holo"] .tile .foil {
    position: absolute; inset: -40%; z-index: 3; pointer-events: none;
    background: linear-gradient(115deg,
      transparent 30%, rgba(255,120,180,0.12) 42%, rgba(140,200,255,0.16) 50%,
      rgba(150,255,200,0.12) 58%, transparent 70%);
    mix-blend-mode: screen;
    transform: translateX(var(--foil-x, -30%)) rotate(8deg);
    transition: transform 0.5s var(--ease-out);
  }
  body[data-theme="holo"] .tile:hover .foil { --foil-x: 30%; }
  body[data-theme="holo"] .tile:hover, body[data-theme="holo"] .tile:focus-visible {
    box-shadow: 0 22px 56px rgba(0,0,0,0.7), 0 0 36px var(--glow-soft, transparent);
  }

  /* ============ hover preview (詳盡資訊只喺呢度出現) ============ */
  #preview {
    position: fixed; z-index: 150; width: 300px; pointer-events: none;
    border-radius: 12px; padding: 16px; opacity: 0; transform: translateY(6px);
    transition: opacity 0.18s var(--ease-out), transform 0.18s var(--ease-out);
    display: flex; gap: 14px;
  }
  #preview.show { opacity: 1; transform: none; }
  body[data-theme="gallery"] #preview { background: rgba(255,255,255,0.96); box-shadow: 0 20px 60px rgba(30,28,22,0.3); color: #1A1A18; }
  body[data-theme="vault"] #preview, body[data-theme="holo"] #preview { background: rgba(20,23,31,0.97); box-shadow: 0 20px 60px rgba(0,0,0,0.7); color: #E8EAF0; }
  #preview img { width: 84px; height: 117px; object-fit: cover; object-position: center 22%; border-radius: 4px; }
  #preview .p-name { font-size: 14px; font-weight: 700; line-height: 1.25; }
  #preview .p-set { font-size: 11px; opacity: 0.6; margin: 2px 0 8px; }
  #preview .p-row { display: flex; justify-content: space-between; font-size: 11.5px; padding: 2px 0; }
  #preview .p-row b { font-variant-numeric: tabular-nums; }
  #preview .p-chg { font-size: 20px; font-weight: 800; margin-top: 6px; }
  #preview .p-chg.up { color: #00C853; } #preview .p-chg.down { color: #FF1744; }

  /* ============ detail modal (click) ============ */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 200; display: none; align-items: center; justify-content: center;
    background: rgba(8,8,12,0); transition: background 0.3s;
  }
  .modal-backdrop.open { display: flex; background: rgba(8,8,12,0.6); backdrop-filter: blur(8px); }
  .modal {
    width: min(760px, 90vw); border-radius: 16px; padding: 30px; position: relative;
    display: flex; gap: 28px; align-items: flex-start;
    transform: translateY(28px) scale(0.95); opacity: 0;
    transition: transform 0.4s var(--ease-spring), opacity 0.3s;
  }
  .modal-backdrop.open .modal { transform: none; opacity: 1; }
  body[data-theme="gallery"] .modal { background: #FFF; box-shadow: 0 34px 90px rgba(30,28,22,0.35); color: #1A1A18; }
  body[data-theme="vault"] .modal, body[data-theme="holo"] .modal { background: #171A22; box-shadow: 0 34px 100px rgba(0,0,0,0.75); color: #E8EAF0; }
  .modal img { width: 210px; border-radius: 8px; }
  .modal h2 { font-size: 22px; margin-bottom: 4px; }
  .modal .sub { font-size: 13px; opacity: 0.6; margin-bottom: 18px; }
  .modal .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 26px; font-size: 12px; }
  .modal .stats span { opacity: 0.6; }
  .modal .stats b { display: block; font-size: 17px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .modal .close { position: absolute; top: 14px; right: 18px; border: 0; background: none; font-size: 22px; cursor: pointer; color: inherit; opacity: 0.5; }
  .modal .close:hover { opacity: 1; }

  /* ============ legend ============ */
  #legend {
    position: fixed; bottom: 34px; left: 50%; transform: translateX(-50%);
    z-index: 100; display: flex; align-items: center; gap: 8px;
    font-size: 11px; letter-spacing: 0.03em; pointer-events: none; font-variant-numeric: tabular-nums;
  }
  #legend .bar { width: 90px; height: 8px; border-radius: 4px; display: inline-block; }
  #legend .bar.down { background: linear-gradient(90deg, #FF1744, rgba(255,23,68,0.05)); }
  #legend .bar.up { background: linear-gradient(90deg, rgba(0,200,83,0.05), #00C853); }
  body[data-theme="gallery"] #legend { color: #55554F; }
  body[data-theme="vault"] #legend, body[data-theme="holo"] #legend { color: #AAB0C0; }

  /* ============ share toast ============ */
  #toast {
    position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%) translateY(10px);
    z-index: 300; padding: 10px 22px; border-radius: 999px; font-size: 13px; font-weight: 600;
    opacity: 0; transition: all 0.3s var(--ease-out); pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translateX(-50%); }
  body[data-theme="gallery"] #toast { background: #1A1A18; color: #F2F1EC; }
  body[data-theme="vault"] #toast, body[data-theme="holo"] #toast { background: #E8EAF0; color: #0A0C10; }

  /* ============ day/dark toggle ============ */
  .daynight {
    position: fixed; top: 16px; right: 150px; z-index: 100;
    display: flex; gap: 2px; padding: 4px; border-radius: 999px;
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    transition: background 0.5s, box-shadow 0.5s;
  }
  .daynight button {
    border: 0; cursor: pointer; font: inherit; font-size: 14px; line-height: 1;
    width: 34px; height: 34px; border-radius: 999px;
    transition: all 0.25s var(--ease-out);
  }
  body[data-theme="gallery"] .daynight { background: rgba(255,255,255,0.78); box-shadow: 0 2px 16px rgba(30,30,30,0.10); }
  body[data-theme="gallery"] .daynight button { background: transparent; color: #6B6B66; }
  body[data-theme="gallery"] .daynight button.active { background: #1A1A18; color: #F2F1EC; }
  body[data-theme="vault"] .daynight, body[data-theme="holo"] .daynight { background: rgba(20,24,32,0.72); box-shadow: 0 2px 24px rgba(0,0,0,0.5); }
  body[data-theme="vault"] .daynight button, body[data-theme="holo"] .daynight button { background: transparent; color: #5E6673; }
  body[data-theme="vault"] .daynight button.active, body[data-theme="holo"] .daynight button.active { background: #E8EAF0; color: #0A0C10; }

  /* ============ tune panel ============ */
  .tune-toggle {
    position: fixed; top: 16px; right: 238px; z-index: 301;
    border: 0; cursor: pointer; font: inherit; font-size: 12px; font-weight: 700;
    padding: 10px 16px; border-radius: 999px; letter-spacing: 0.06em;
    transition: all 0.25s var(--ease-out);
  }
  body[data-theme="gallery"] .tune-toggle { background: rgba(255,255,255,0.78); color: #1A1A18; box-shadow: 0 2px 16px rgba(30,30,30,0.10); }
  body[data-theme="vault"] .tune-toggle, body[data-theme="holo"] .tune-toggle { background: rgba(20,24,32,0.72); color: #E8EAF0; box-shadow: 0 2px 24px rgba(0,0,0,0.5); }
  .tune-panel {
    position: fixed; top: 62px; right: 16px; z-index: 300;
    width: 272px; max-height: calc(100vh - 100px); overflow-y: auto;
    border-radius: 14px; padding: 16px 16px 12px;
    font-size: 11px; letter-spacing: 0.03em;
    opacity: 0; transform: translateX(16px); pointer-events: none;
    transition: opacity 0.25s var(--ease-out), transform 0.25s var(--ease-out);
  }
  .tune-panel.open { opacity: 1; transform: none; pointer-events: auto; }
  body[data-theme="gallery"] .tune-panel { background: rgba(255,255,255,0.94); box-shadow: 0 18px 50px rgba(30,28,22,0.28); color: #1A1A18; }
  body[data-theme="vault"] .tune-panel, body[data-theme="holo"] .tune-panel { background: rgba(20,23,31,0.96); box-shadow: 0 18px 50px rgba(0,0,0,0.65); color: #E8EAF0; }
  .tune-panel h3 { font-size: 10px; font-weight: 800; letter-spacing: 0.22em; text-transform: uppercase; opacity: 0.5; margin-bottom: 10px; }
  .tune-panel h4 { font-size: 9px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.38; margin: 14px 0 2px; border-top: 1px solid rgba(128,128,128,0.22); padding-top: 10px; }
  .tune-row { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
  .tune-row label { width: 96px; flex: none; font-weight: 600; opacity: 0.75; }
  .tune-row input[type="range"] { flex: 1; accent-color: #FFD54A; height: 18px; }
  .tune-row .val { width: 40px; text-align: right; font-variant-numeric: tabular-nums; opacity: 0.85; flex: none; }
  .tune-row input[type="number"] {
    width: 56px; font: inherit; font-variant-numeric: tabular-nums;
    border: 1px solid rgba(128,128,128,0.35); border-radius: 5px; padding: 3px 6px; background: transparent; color: inherit;
  }
  .tune-row input[type="color"] {
    width: 30px; height: 22px; border: 1px solid rgba(128,128,128,0.35); border-radius: 5px;
    padding: 0 2px; background: transparent; cursor: pointer; flex: none;
  }
  .tune-row .hex { width: 62px; font: inherit; font-size: 10px; font-variant-numeric: tabular-nums;
    border: 1px solid rgba(128,128,128,0.35); border-radius: 5px; padding: 3px 6px; background: transparent; color: inherit; }
  .tune-actions { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
  .tune-actions button {
    flex: 1; min-width: 70px; border: 1px solid rgba(128,128,128,0.4); cursor: pointer;
    font: inherit; font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
    padding: 7px 4px; border-radius: 7px; background: transparent; color: inherit;
    transition: all 0.2s;
  }
  body[data-theme="gallery"] .tune-actions button:hover { background: #1A1A18; color: #F2F1EC; border-color: #1A1A18; }
  body[data-theme="vault"] .tune-actions button:hover, body[data-theme="holo"] .tune-actions button:hover { background: #E8EAF0; color: #0A0C10; border-color: #E8EAF0; }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; animation: none !important; }
  }
</style>
</head>
<body data-theme="gallery" data-mode="day">

<div class="switcher" role="tablist">
  <button data-theme="gallery" class="active">Gallery</button>
  <button data-theme="vault">Vault</button>
  <button data-theme="holo">Holo</button>
</div>

<div class="period-switcher" role="tablist" aria-label="Period">
  <button data-period="chg1" disabled>1D</button>
  <button data-period="chg7" disabled>7D</button>
  <button data-period="chg30" class="active">30D</button>
</div>
<p class="period-note" id="periodNote"></p>

<div class="daynight" role="tablist" aria-label="Day / dark mode">
  <button data-mode="day" class="active" title="Daylight">☀</button>
  <button data-mode="dark" title="Dark">☾</button>
</div>

<button class="share-btn" id="shareBtn">⬇ Share card</button>

<button class="tune-toggle" id="tuneToggle">TUNE</button>

<aside class="tune-panel" id="tunePanel">
  <h3>調節面板 · 開會拍板用</h3>

  <div class="tune-row">
    <label>卡數</label>
    <input type="range" id="tCount" min="1" max="100" step="1" value="50">
    <input type="number" id="tCountN" min="1" max="100" step="1" value="50">
  </div>

  <h4>色碼</h4>
  <div class="tune-row">
    <label>升色</label>
    <input type="color" id="tUp" value="#00C853">
    <input type="text" class="hex" id="tUpHex" value="#00C853" spellcheck="false">
  </div>
  <div class="tune-row">
    <label>跌色</label>
    <input type="color" id="tDown" value="#FF1744">
    <input type="text" class="hex" id="tDownHex" value="#FF1744" spellcheck="false">
  </div>
  <div class="tune-row">
    <label>中性色</label>
    <input type="color" id="tNeutral" value="#808084">
    <input type="text" class="hex" id="tNeutralHex" value="#808084" spellcheck="false">
  </div>
  <div class="tune-row">
    <label>黃字色</label>
    <input type="color" id="tBadge" value="#FFD54A">
    <input type="text" class="hex" id="tBadgeHex" value="#FFD54A" spellcheck="false">
  </div>

  <h4>深淺</h4>
  <div class="tune-row">
    <label>爆色 %</label>
    <input type="range" id="tClamp" min="5" max="30" step="1" value="15">
    <span class="val" id="tClampV">15</span>
  </div>
  <div class="tune-row">
    <label>最淺透明度</label>
    <input type="range" id="tAMin" min="0" max="0.30" step="0.01" value="0.04">
    <span class="val" id="tAMinV">0.04</span>
  </div>
  <div class="tune-row">
    <label>最深透明度</label>
    <input type="range" id="tAMax" min="0.10" max="0.90" step="0.01" value="0.54">
    <span class="val" id="tAMaxV">0.54</span>
  </div>
  <div class="tune-row">
    <label>加深曲線</label>
    <input type="range" id="tGamma" min="0.50" max="2.00" step="0.05" value="0.85">
    <span class="val" id="tGammaV">0.85</span>
  </div>

  <h4>表面</h4>
  <div class="tune-row">
    <label>卡圖模糊</label>
    <input type="range" id="tBlur" min="0" max="8" step="0.5" value="0">
    <span class="val" id="tBlurV">0</span>
  </div>
  <div class="tune-row">
    <label>格仔縫隙</label>
    <input type="range" id="tGap" min="0" max="6" step="1" value="1">
    <span class="val" id="tGapV">1</span>
  </div>
  <div class="tune-row">
    <label>黃字數量</label>
    <input type="range" id="tBadges" min="0" max="20" step="1" value="12">
    <span class="val" id="tBadgesV">12</span>
  </div>

  <div class="tune-actions">
    <button id="tV1">V1 舊色</button>
    <button id="tV2">V2 新色</button>
    <button id="tCopy">複製設定</button>
  </div>
</aside>

<div id="stage"></div>

<div id="legend">
  <span id="legendLo">−15%+</span><i class="bar down" id="barDown"></i><span>0</span><i class="bar up" id="barUp"></i><span id="legendHi">+15%+</span>
  <span style="opacity:0.4;margin-left:6px" id="legendCount">· TOP 50</span>
</div>
<p class="hint">hover = 聚焦 + 詳情 · click = 完整卡片 · 1/2/3 = 主題 · L = 日光/暗黑 · T = 調節面板 · S = 分享圖</p>

<div id="preview"></div>

<div class="modal-backdrop" id="backdrop">
  <div class="modal" role="dialog" aria-modal="true">
    <button class="close" id="modalClose">✕</button>
    <img id="mImg" src="" alt="">
    <div>
      <h2 id="mName"></h2>
      <p class="sub" id="mSet"></p>
      <div class="stats">
        <div><span>Market cap</span><b id="mCap"></b></div>
        <div><span>PSA 10 price</span><b id="mPrice"></b></div>
        <div><span>1D change</span><b id="mChg1"></b></div>
        <div><span>7D change</span><b id="mChg7"></b></div>
        <div><span>30D change</span><b id="mChg"></b></div>
        <div><span>30D tracked sales</span><b id="mSales"></b></div>
        <div><span>PSA 10 population</span><b id="mPop"></b></div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ================= 真實數據 (seed-snapshot top100) ================= */
let cards = [];
let period = "chg30";                    // chg1 | chg7 | chg30
const PERIOD_LABEL = { chg1: "1D", chg7: "7D", chg30: "30D" };
const PERIOD_DESC = { chg1: "24-hour window", chg7: "7-day window", chg30: "30-day window" };
const stage = document.getElementById("stage");

/* ================= squarified treemap（大先入位、蛇形填位） ================= */
const TARGET = 0.714, IDEAL = 1 / TARGET;
function worstRatio(areas, side) {
  const rowArea = areas.reduce((a, b) => a + b, 0);
  const t = rowArea / side;
  let worst = 0;
  for (const a of areas) {
    const aspect = (a / t) / t;
    const r = Math.max(aspect, 1 / aspect);
    worst = Math.max(worst, Math.abs(Math.log(r / IDEAL)));
  }
  return worst;
}
function layoutRow(row, rect, scale, tiles) {
  const rowArea = row.reduce((s, c) => s + c.cap * scale, 0);
  if (rect.w >= rect.h) {
    const rw = rowArea / rect.h;
    let ry = rect.y;
    row.forEach((c, i) => {
      const ch = i === row.length - 1 ? rect.y + rect.h - ry : c.cap * scale / rw;
      tiles.push({ c, x: rect.x, y: ry, w: rw, h: ch }); ry += ch;
    });
    rect.x += rw; rect.w -= rw;
  } else {
    const rh = rowArea / rect.w;
    let rx = rect.x;
    row.forEach((c, i) => {
      const cw = i === row.length - 1 ? rect.x + rect.w - rx : c.cap * scale / rh;
      tiles.push({ c, x: rx, y: rect.y, w: cw, h: rh }); rx += cw;
    });
    rect.y += rh; rect.h -= rh;
  }
}
function layout(items, W, H) {
  const sorted = [...items].sort((a, b) => b.cap - a.cap);
  const scale = W * H / sorted.reduce((s, c) => s + c.cap, 0);
  const rect = { x: 0, y: 0, w: W, h: H };
  const tiles = []; let row = []; const queue = [...sorted];
  while (queue.length) {
    const side = Math.min(rect.w, rect.h);
    const areas = row.map(c => c.cap * scale);
    const next = queue[0].cap * scale;
    if (row.length && worstRatio([...areas, next], side) > worstRatio(areas, side)) {
      layoutRow(row, rect, scale, tiles); row = [];
    } else row.push(queue.shift());
  }
  if (row.length) layoutRow(row, rect, scale, tiles);
  return tiles;
}

/* ================= 全域調節參數（TUNE 面板 + sharePNG 共用） ================= */
const PRESETS = {
  v2: { up: "#00C853", down: "#FF1744", neutral: "#808084", badge: "#FFD54A", clamp: 15, aMin: 0.04, aMax: 0.54, gamma: 0.85, blur: 0, gap: 1 },
  // V1 舊版色碼（apps/web/src/components/heatmap.tsx tileTint）：深綠 / 深玫紅 / 石板灰
  v1: { up: "#1B714E", down: "#972646", neutral: "#454B52", badge: "#FFD54A", clamp: 10, aMin: 0.26, aMax: 0.60, gamma: 1.0, blur: 0, gap: 1 },
};
const CFG = { count: 50, badgeCount: 12, ...PRESETS.v2 };
function hexToRgb(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec((hex || "").trim());
  if (!m) return null;
  const n = parseInt(m[1], 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

/* ================= 板塊分區（已移除 — 大區唔准俾獨立區域） ================= */

/* ================= 極致色塊（參數由 CFG 驅動） ================= */
function tintStyle(chg) {
  const [nr, ng, nb] = hexToRgb(CFG.neutral) || [128, 128, 132];
  if (chg === null || chg === undefined || !isFinite(chg)) {
    return `rgba(${nr},${ng},${nb},0.10)`;
  }
  const t = Math.pow(Math.min(Math.abs(chg), CFG.clamp) / CFG.clamp, CFG.gamma);
  const a = CFG.aMin + t * (CFG.aMax - CFG.aMin);
  if (chg > 0) { const [r, g, b] = hexToRgb(CFG.up) || [0, 200, 83]; return `rgba(${r},${g},${b},${a.toFixed(3)})`; }
  if (chg < 0) { const [r, g, b] = hexToRgb(CFG.down) || [255, 23, 68]; return `rgba(${r},${g},${b},${a.toFixed(3)})`; }
  return `rgba(${nr},${ng},${nb},0.06)`;
}
function glowPair(chg) {
  if (chg === null) return ["transparent", "transparent"];
  const t = Math.min(Math.abs(chg), CFG.clamp) / CFG.clamp;
  const col = chg > 0 ? CFG.up : chg < 0 ? CFG.down : CFG.neutral;
  const [r, g, b] = hexToRgb(col) || [128, 128, 132];
  return [`rgba(${r},${g},${b}, ${(0.3 + t * 0.6).toFixed(2)})`, `rgba(${r},${g},${b}, ${(0.12 + t * 0.28).toFixed(2)})`];
}

/* ================= render ================= */
function render() {
  stage.innerHTML = "";
  const rect = stage.getBoundingClientRect();
  const shown = cards.slice(0, CFG.count);
  const topBadge = new Set(shown.slice(0, CFG.badgeCount).map(c => c.rank));
  layout(shown, rect.width, rect.height).forEach(({ c, x, y, w, h }) => {
    if (w < 10 || h < 10) return;
    const el = document.createElement("div");
    el.className = "tile"; el.tabIndex = 0;
    el.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px;`;
    el.dataset.tcg = c.tcg;
    const chg = c[period];
    const [g, gs] = glowPair(chg);
    el.style.setProperty("--glow", g);
    el.style.setProperty("--glow-soft", gs);
    el.style.setProperty("--card-blur", CFG.blur + "px");
    el.style.setProperty("--gap-inset", CFG.gap + "px");
    const badge = topBadge.has(c.rank) && chg != null
      ? `<span class="bigpct" style="color:${CFG.badge}">${chg > 0 ? "+" : ""}${chg.toFixed(1)}%</span>`
      : "";
    el.innerHTML = `
      <img src="${c.img}" alt="" loading="eager"
           onerror="this.onerror=null;this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22438%22 height=%22610%22%3E%3Crect width=%22438%22 height=%22610%22 fill=%22%2322262e%22/%3E%3C/svg%3E'">
      <span class="tint" style="background:${tintStyle(chg)}"></span>
      ${badge}
      <span class="foil"></span>`;
    el.addEventListener("pointerenter", () => showPreview(c, el));
    el.addEventListener("pointerleave", hidePreview);
    el.addEventListener("click", () => { hidePreview(); openModal(c); });
    el.addEventListener("pointermove", e => {
      if (document.body.dataset.theme !== "holo") return;
      const b = el.getBoundingClientRect();
      const px = (e.clientX - b.left) / b.width - 0.5;
      const py = (e.clientY - b.top) / b.height - 0.5;
      el.style.transform = `perspective(700px) rotateY(${px * 9}deg) rotateX(${-py * 9}deg) scale(1.07)`;
    });
    el.addEventListener("pointerleave", () => { el.style.transform = ""; });
    stage.appendChild(el);
  });

  document.getElementById("legendCount").textContent = `· TOP ${shown.length}`;
  document.getElementById("legendLo").textContent = `−${CFG.clamp}%+`;
  document.getElementById("legendHi").textContent = `+${CFG.clamp}%+`;
  document.getElementById("barDown").style.background =
    `linear-gradient(90deg, ${CFG.down}, ${tintStyle(-0.0001)})`;
  document.getElementById("barUp").style.background =
    `linear-gradient(90deg, ${tintStyle(0.0001)}, ${CFG.up})`;
}

/* ================= hover preview ================= */
const preview = document.getElementById("preview");
const fmt$ = v => v == null ? "—" : "$" + (v >= 1e6 ? (v / 1e6).toFixed(1) + "M" : v >= 1e3 ? (v / 1e3).toFixed(1) + "K" : v.toLocaleString());
const fmtPct = v => v == null ? "—" : (v > 0 ? "+" : "") + v.toFixed(1) + "%";
function showPreview(c, el) {
  const chg = c[period];
  const chgCls = chg > 0 ? "up" : "down";
  preview.innerHTML = `
    <img src="${c.img}" alt="">
    <div style="flex:1;min-width:0">
      <div class="p-name">${c.name}</div>
      <div class="p-set">#${c.rank} · ${c.num} · ${c.tcg}</div>
      <div class="p-row"><span>Market cap</span><b>${fmt$(c.cap)}</b></div>
      <div class="p-row"><span>PSA 10</span><b>${fmt$(c.pricePsa10)}</b></div>
      <div class="p-row"><span>30D sales</span><b>${c.sales30}</b></div>
      <div class="p-chg ${chgCls}">${fmtPct(chg)} <span style="font-size:11px;opacity:0.55;font-weight:600">${PERIOD_LABEL[period]}</span></div>
    </div>`;
  const b = el.getBoundingClientRect();
  const pw = 300, ph = 170;
  let px = b.right + 12, py = b.top + b.height / 2 - ph / 2;
  if (px + pw > innerWidth - 12) px = b.left - pw - 12;
  py = Math.max(70, Math.min(innerHeight - ph - 50, py));
  preview.style.left = px + "px"; preview.style.top = py + "px";
  preview.classList.add("show");
}
function hidePreview() { preview.classList.remove("show"); }

/* ================= modal ================= */
const backdrop = document.getElementById("backdrop");
function openModal(c) {
  document.getElementById("mImg").src = c.img;
  document.getElementById("mName").textContent = `#${c.rank} ${c.name}`;
  document.getElementById("mSet").textContent = `${c.num} · ${c.set || c.tcg}`;
  document.getElementById("mCap").textContent = fmt$(c.cap);
  document.getElementById("mPrice").textContent = fmt$(c.pricePsa10);
  const mChg = document.getElementById("mChg");
  mChg.textContent = fmtPct(c.chg30);
  mChg.style.color = c.chg30 > 0 ? CFG.up : c.chg30 < 0 ? CFG.down : "inherit";
  const mChg1 = document.getElementById("mChg1");
  mChg1.parentElement.style.display = c.chg1 == null ? "none" : "";
  mChg1.textContent = fmtPct(c.chg1);
  mChg1.style.color = c.chg1 > 0 ? CFG.up : c.chg1 < 0 ? CFG.down : "inherit";
  const mChg7 = document.getElementById("mChg7");
  mChg7.parentElement.style.display = c.chg7 == null ? "none" : "";
  mChg7.textContent = fmtPct(c.chg7);
  mChg7.style.color = c.chg7 > 0 ? CFG.up : c.chg7 < 0 ? CFG.down : "inherit";
  document.getElementById("mSales").textContent = `${c.sales30} · ${fmt$(c.salesValue30)}`;
  document.getElementById("mPop").textContent = c.pop == null ? "—" : c.pop.toLocaleString();
  backdrop.classList.add("open");
}
document.getElementById("modalClose").onclick = () => backdrop.classList.remove("open");
backdrop.addEventListener("mousedown", e => { if (e.target === backdrop) backdrop.classList.remove("open"); });

/* ================= share PNG — 富士菲林藝術品（1600×1000） =================
   米白相紙邊、細黑內框、角落對位十字、菲林齒孔、QR 留位、紙紋噪點。 */
async function sharePNG() {
  const btn = document.getElementById("shareBtn");
  btn.disabled = true;

  const W = 1600, H = 1000;
  const PAPER = 48;                       // 相紙邊
  const FRAME_INSET = 12;                 // 內框離相紙邊
  const FX = PAPER + FRAME_INSET;         // 內框 x
  const FY = PAPER + FRAME_INSET + 62;    // 內框 y（上面留 header 位）
  const FW = W - FX * 2;
  const FH = H - FY - PAPER - FRAME_INSET - 52;  // 底部留齒孔 + 說明行

  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");

  const asOf = (cards[0] && cards[0].asOf) ? cards[0].asOf.slice(0, 10) : new Date().toISOString().slice(0, 10);

  /* 1. 米白相紙底 */
  ctx.fillStyle = "#F4F1E8";
  ctx.fillRect(0, 0, W, H);

  /* 2. header：品牌 + 期間 pill + 截數日期 */
  ctx.fillStyle = "#1A1A18";
  ctx.font = "800 30px -apple-system, 'SF Pro Display', Arial, sans-serif";
  ctx.fillText("CARDZ", FX, PAPER + 6);
  const cw = ctx.measureText("CARDZ").width;
  ctx.fillStyle = "#8A887F";
  ctx.font = "300 30px -apple-system, 'SF Pro Display', Arial, sans-serif";
  ctx.fillText(" MARKET CAP", FX + cw, PAPER + 6);
  const mw = ctx.measureText(" MARKET CAP").width;

  // 期間 pill（1px 線框）
  const plabel = PERIOD_LABEL[period];
  ctx.font = "700 14px -apple-system, Arial, sans-serif";
  const pw = ctx.measureText(plabel).width;
  const px = FX + cw + mw + 16;
  ctx.strokeStyle = "#1A1A18";
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(px, PAPER - 16, pw + 18, 24, 12); ctx.stroke();
  ctx.fillStyle = "#1A1A18";
  ctx.fillText(plabel, px + 9, PAPER + 1);

  // 截數日期（右對齊）
  ctx.textAlign = "right";
  ctx.font = "500 14px -apple-system, Arial, sans-serif";
  ctx.fillStyle = "rgba(26,26,24,0.6)";
  ctx.fillText("As of " + asOf, W - FX, PAPER + 5);
  ctx.textAlign = "left";

  // header 裝飾線
  ctx.strokeStyle = "#1A1A18";
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(FX, PAPER + 22); ctx.lineTo(FX + 120, PAPER + 22); ctx.stroke();

  /* 3. 內框陰影（幅畫微浮起） */
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,0.06)";
  ctx.shadowBlur = 10;
  ctx.shadowOffsetY = 3;
  ctx.fillStyle = "#EDEAE0";
  ctx.fillRect(FX, FY, FW, FH);
  ctx.restore();

  const shown = cards.slice(0, CFG.count);
  const tiles = layout(shown, FW, FH);
  const topBadge = new Set(shown.slice(0, CFG.badgeCount).map(c => c.rank));
  const loadImg = src => new Promise(res => {
    const im = new Image(); im.crossOrigin = "anonymous";
    im.onload = () => res(im); im.onerror = () => res(null);
    im.src = src;
  });
  const imgs = await Promise.all(tiles.map(t => loadImg(t.c.img)));

  /* 卡圖 blur 用離屏 canvas 先處理（同 DOM 版 --card-blur 對齊） */
  const blurImg = im => {
    if (!im || !CFG.blur) return im;
    const off = document.createElement("canvas");
    off.width = im.width; off.height = im.height;
    const octx = off.getContext("2d");
    octx.filter = `blur(${CFG.blur}px)`;
    octx.drawImage(im, 0, 0);
    return off;
  };
  const blurred = imgs.map(blurImg);

  tiles.forEach((t, i) => {
    const GAP = CFG.gap;
    const x = FX + t.x + GAP / 2, y = FY + t.y + GAP / 2, w = t.w - GAP, h = t.h - GAP;
    if (w < 4 || h < 4) return;
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    const im = blurred[i];
    if (im) {
      const ir = im.width / im.height, tr = w / h;
      let sw, sh, sx, sy;
      if (ir > tr) { sh = im.height; sw = sh * tr; sx = (im.width - sw) / 2; sy = 0; }
      else { sw = im.width; sh = sw / tr; sx = 0; sy = (im.height - sh) * 0.22; }
      ctx.drawImage(im, sx, sy, sw, sh, x, y, w, h);
    } else {
      ctx.fillStyle = "#DDDAD2";
      ctx.fillRect(x, y, w, h);
    }
    ctx.fillStyle = tintStyle(t.c[period]);
    ctx.fillRect(x, y, w, h);
    // 頭 N 大左下黃字
    if (topBadge.has(t.c.rank) && t.c[period] != null) {
      const label = (t.c[period] > 0 ? "+" : "") + t.c[period].toFixed(1) + "%";
      ctx.font = "800 15px -apple-system, 'SF Pro Display', Arial, sans-serif";
      ctx.shadowColor = "rgba(0,0,0,0.85)";
      ctx.shadowBlur = 6;
      ctx.fillStyle = CFG.badge;
      ctx.fillText(label, x + 7, y + h - 8);
      ctx.shadowBlur = 0;
    }
    ctx.restore();
  });

  /* 5. 細黑內框線 + 角落對位十字 */
  ctx.strokeStyle = "#1A1A18";
  ctx.lineWidth = 1;
  ctx.strokeRect(FX, FY, FW, FH);
  const corners = [[FX, FY], [FX + FW, FY], [FX, FY + FH], [FX + FW, FY + FH]];
  ctx.beginPath();
  corners.forEach(([cx, cy]) => {
    ctx.moveTo(cx - 5, cy); ctx.lineTo(cx + 5, cy);
    ctx.moveTo(cx, cy - 5); ctx.lineTo(cx, cy + 5);
  });
  ctx.stroke();

  /* 6. 菲林齒孔（底部，齊 header 右邊） */
  const perfY = FY + FH + 18;
  const perfW = 9, perfH = 13, perfGap = 22;
  const perfEnd = W - FX - 76;                 // 右邊留位俾 QR
  const perfCount = Math.floor((perfEnd - FX) / perfGap);
  ctx.fillStyle = "#3A3A36";
  for (let i = 0; i < perfCount; i++) {
    const px = FX + i * perfGap;
    ctx.beginPath(); ctx.roundRect(px, perfY, perfW, perfH, 2); ctx.fill();
  }

  /* 7. QR 留位（虛線框）+ 文字網址 */
  const qrSize = 56;
  const qrX = W - FX - qrSize;
  const qrY = FY + FH + 8;
  ctx.strokeStyle = "#8A887F";
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 3]);
  ctx.strokeRect(qrX, qrY, qrSize, qrSize);
  ctx.setLineDash([]);
  ctx.fillStyle = "#8A887F";
  ctx.font = "600 11px -apple-system, Arial, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("QR", qrX + qrSize / 2, qrY + qrSize / 2 + 4);
  ctx.fillText("cardz.io", qrX + qrSize / 2, qrY + qrSize + 15);
  ctx.textAlign = "left";

  /* 8. 底部說明行（全大寫 + 字距，印刷感） */
  ctx.font = "600 10px -apple-system, Arial, sans-serif";
  ctx.fillStyle = "rgba(26,26,24,0.55)";
  const desc = `PSA 10  ·  TOP ${shown.length}  ·  ${PERIOD_DESC[period].toUpperCase()}  ·  AS OF ${asOf.toUpperCase()}`;
  // 手動加字距
  let dx = FX;
  for (const ch of desc) {
    ctx.fillText(ch, dx, perfY + perfH + 18);
    dx += ctx.measureText(ch).width + 2.2;
  }

  /* 8b. 版數標記（右上角，極細，似限量版畫嘅編號） */
  ctx.font = "400 9px -apple-system, Arial, sans-serif";
  ctx.fillStyle = "rgba(26,26,24,0.38)";
  ctx.textAlign = "right";
  ctx.fillText(`N° ${asOf.replace(/-/g, '')} / ${shown.length}`, W - FX + 4, FY - 16);
  ctx.textAlign = "left";

  /* 8c. 左下角極細品牌浮水印（斜放，似相紙暗記） */
  ctx.save();
  ctx.font = "300 8px -apple-system, Arial, sans-serif";
  ctx.fillStyle = "rgba(26,26,24,0.18)";
  ctx.translate(FX - 14, FY + FH);
  ctx.rotate(-Math.PI / 2);
  ctx.fillText("CARDZ · MARKET INTELLIGENCE", 0, 0);
  ctx.restore();

  /* 9. 紙紋噪點（極淡，相紙纖維感） */
  ctx.fillStyle = "rgba(26,26,24,0.5)";
  for (let i = 0; i < 5000; i++) {
    const nx = Math.random() * W, ny = Math.random() * H;
    ctx.globalAlpha = Math.random() * 0.03;
    ctx.fillRect(nx, ny, 1, 1);
  }
  ctx.globalAlpha = 1;

  /* 導出 */
  const a = document.createElement("a");
  a.download = `cardz-market-cap-${PERIOD_LABEL[period].toLowerCase()}-${asOf}.png`;
  a.href = canvas.toDataURL("image/png");
  a.click();
  btn.disabled = false;
  const toast = document.getElementById("toast");
  toast.textContent = "PNG 已儲存 — 貼落任何群組會自動預覽";
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2600);
}
document.getElementById("shareBtn").onclick = sharePNG;

/* ================= 日光 / 暗黑 =================
   Daylight = gallery（米白），Dark = vault（深藍黑）。
   holo 係第三主題，維持 1/2/3 鍵入，但 ☀/☾ toggle 只喺日/暗之間走。 */
const MODE_THEME = { day: "gallery", dark: "vault" };
function setTheme(t) {
  document.body.dataset.theme = t;
  document.body.dataset.mode = t === "vault" ? "dark" : t === "gallery" ? "day" : "holo";
  document.querySelectorAll(".switcher button").forEach(b => b.classList.toggle("active", b.dataset.theme === t));
  document.querySelectorAll(".daynight button").forEach(b => b.classList.toggle("active", b.dataset.mode === document.body.dataset.mode));
}
function setMode(m) { setTheme(MODE_THEME[m]); }
document.querySelectorAll(".daynight button").forEach(b => b.onclick = () => setMode(b.dataset.mode));

/* ================= TUNE 面板 ================= */
const tunePanel = document.getElementById("tunePanel");
function showToast(msg) {
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove("show"), 2400);
}
function bindRange(rangeId, valId, key, fmt, after) {
  const el = document.getElementById(rangeId);
  const out = valId ? document.getElementById(valId) : null;
  el.addEventListener("input", () => {
    CFG[key] = parseFloat(el.value);
    if (out) out.textContent = fmt ? fmt(CFG[key]) : CFG[key];
    render();
    if (after) after();
  });
}
function bindColor(colorId, hexId, key) {
  const c = document.getElementById(colorId);
  const h = document.getElementById(hexId);
  const apply = v => {
    if (!hexToRgb(v)) return;
    CFG[key] = v.toUpperCase();
    c.value = CFG[key];
    if (h.value.toUpperCase() !== CFG[key]) h.value = CFG[key];
    render();
  };
  c.addEventListener("input", () => apply(c.value));
  h.addEventListener("change", () => apply(h.value));
}
function syncPanel() {
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.value = v; };
  set("tCount", CFG.count); set("tCountN", CFG.count);
  set("tUp", CFG.up); set("tUpHex", CFG.up);
  set("tDown", CFG.down); set("tDownHex", CFG.down);
  set("tNeutral", CFG.neutral); set("tNeutralHex", CFG.neutral);
  set("tBadge", CFG.badge); set("tBadgeHex", CFG.badge);
  set("tClamp", CFG.clamp); document.getElementById("tClampV").textContent = CFG.clamp;
  set("tAMin", CFG.aMin); document.getElementById("tAMinV").textContent = CFG.aMin.toFixed(2);
  set("tAMax", CFG.aMax); document.getElementById("tAMaxV").textContent = CFG.aMax.toFixed(2);
  set("tGamma", CFG.gamma); document.getElementById("tGammaV").textContent = CFG.gamma.toFixed(2);
  set("tBlur", CFG.blur); document.getElementById("tBlurV").textContent = CFG.blur;
  set("tGap", CFG.gap); document.getElementById("tGapV").textContent = CFG.gap;
  set("tBadges", CFG.badgeCount); document.getElementById("tBadgesV").textContent = CFG.badgeCount;
}
function initTune() {
  document.getElementById("tuneToggle").onclick = () => tunePanel.classList.toggle("open");

  // 卡數：slider + number 雙向
  const cntR = document.getElementById("tCount"), cntN = document.getElementById("tCountN");
  const setCount = v => {
    CFG.count = Math.max(1, Math.min(cards.length || 100, Math.round(v)));
    cntR.value = CFG.count; cntN.value = CFG.count;
    render();
  };
  cntR.addEventListener("input", () => setCount(cntR.value));
  cntN.addEventListener("change", () => setCount(cntN.value));

  bindColor("tUp", "tUpHex", "up");
  bindColor("tDown", "tDownHex", "down");
  bindColor("tNeutral", "tNeutralHex", "neutral");
  bindColor("tBadge", "tBadgeHex", "badge");

  bindRange("tClamp", "tClampV", "clamp");
  bindRange("tAMin", "tAMinV", "aMin", v => v.toFixed(2));
  bindRange("tAMax", "tAMaxV", "aMax", v => v.toFixed(2));
  bindRange("tGamma", "tGammaV", "gamma", v => v.toFixed(2));
  bindRange("tBlur", "tBlurV", "blur");
  bindRange("tGap", "tGapV", "gap");
  bindRange("tBadges", "tBadgesV", "badgeCount");

  const applyPreset = p => { Object.assign(CFG, PRESETS[p]); syncPanel(); render(); };
  document.getElementById("tV1").onclick = () => { applyPreset("v1"); showToast("已套用 V1 舊版色碼"); };
  document.getElementById("tV2").onclick = () => { applyPreset("v2"); showToast("已套用 V2 新版色碼"); };
  document.getElementById("tCopy").onclick = async () => {
    const json = JSON.stringify(CFG, null, 1);
    try { await navigator.clipboard.writeText(json); showToast("設定已複製 — 貼落群組就可以拍板"); }
    catch { showToast(json); }
  };
}

/* ================= 期間切換 ================= */
document.querySelectorAll(".switcher button").forEach(b => b.onclick = () => setTheme(b.dataset.theme));

document.querySelectorAll(".period-switcher button").forEach(b => b.onclick = () => {
  if (b.disabled) return;
  period = b.dataset.period;
  document.querySelectorAll(".period-switcher button").forEach(x => x.classList.toggle("active", x === b));
  render();
});

/* 邊個窗口有真數據就開邊個 — 後端 1D/7D 仲係 accumulating 就禁用 + 提示 */
function initPeriods() {
  const btns = [...document.querySelectorAll(".period-switcher button")];
  const hasData = p => cards.some(c => c[p] != null);
  let firstAvail = null;
  btns.forEach(b => {
    const ok = hasData(b.dataset.period);
    b.disabled = !ok;
    if (ok && !firstAvail) firstAvail = b;
  });
  if (!hasData(period) && firstAvail) {
    period = firstAvail.dataset.period;
    btns.forEach(x => x.classList.toggle("active", x === firstAvail));
  }
  const missing = btns.filter(b => b.disabled).map(b => b.textContent);
  document.getElementById("periodNote").textContent =
    missing.length ? `${missing.join(" · ")} collecting — ${btns.filter(b => !b.disabled).map(b => b.textContent).join(" · ")} live` : "";
}
document.addEventListener("keydown", e => {
  if (e.target.matches("input, textarea")) return;
  if (e.key === "Escape") { backdrop.classList.remove("open"); tunePanel.classList.remove("open"); }
  const map = { "1": "gallery", "2": "vault", "3": "holo" };
  if (map[e.key]) setTheme(map[e.key]);
  if (e.key.toLowerCase() === "l") setMode(document.body.dataset.mode === "day" ? "dark" : "day");
  if (e.key.toLowerCase() === "t") tunePanel.classList.toggle("open");
  if (e.key.toLowerCase() === "s") sharePNG();
});

/* ================= boot ================= */
window.addEventListener("resize", render);
fetch("real-cards.json")
  .then(r => r.json())
  .then(data => {
    cards = data;
    initPeriods(); initTune(); render();
    // 預載全部卡圖 — demo 一開就齊圖，唔會灰住等 lazy load
    cards.forEach(c => { const im = new Image(); im.src = c.img; });
  });
</script>
