<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CARDZ Market Cap — Heatmap Concepts</title>
<style>
  :root {
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-spring: cubic-bezier(0.32, 0.72, 0, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    font-variant-numeric: tabular-nums;
    overflow: hidden;
    transition: background 0.5s var(--ease-out);
  }

  /* ============ switcher ============ */
  .switcher {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    z-index: 100; display: flex; gap: 6px; padding: 5px; border-radius: 999px;
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    transition: background 0.5s, box-shadow 0.5s;
  }
  .switcher button {
    border: 0; cursor: pointer; font: inherit; font-size: 13px; font-weight: 600;
    padding: 8px 18px; border-radius: 999px; letter-spacing: 0.02em;
    transition: all 0.25s var(--ease-out);
  }
  body[data-theme="gallery"] { background: #F2F1EC; }
  body[data-theme="gallery"] .switcher { background: rgba(255,255,255,0.78); box-shadow: 0 2px 16px rgba(30,30,30,0.12); }
  body[data-theme="gallery"] .switcher button { background: transparent; color: #6B6B66; }
  body[data-theme="gallery"] .switcher button.active { background: #1A1A18; color: #F2F1EC; }

  body[data-theme="vault"] { background: #0A0C10; }
  body[data-theme="vault"] .switcher { background: rgba(20,24,32,0.72); box-shadow: 0 2px 24px rgba(0,0,0,0.6); }
  body[data-theme="vault"] .switcher button { background: transparent; color: #5E6673; }
  body[data-theme="vault"] .switcher button.active { background: #E8EAF0; color: #0A0C10; }

  body[data-theme="holo"] { background: #0E1016; }
  body[data-theme="holo"] .switcher { background: rgba(24,26,36,0.68); box-shadow: 0 2px 24px rgba(0,0,0,0.55); }
  body[data-theme="holo"] .switcher button { background: transparent; color: #7A7F92; }
  body[data-theme="holo"] .switcher button.active { background: linear-gradient(110deg, #B9C6FF, #F3C6FF, #C6F0FF); color: #14151F; }

  /* ============ share button ============ */
  .share-btn {
    position: fixed; top: 20px; right: 24px; z-index: 100;
    border: 0; cursor: pointer; font: inherit; font-size: 13px; font-weight: 700;
    padding: 10px 20px; border-radius: 999px; letter-spacing: 0.02em;
    transition: all 0.25s var(--ease-out);
    display: flex; align-items: center; gap: 8px;
  }
  body[data-theme="gallery"] .share-btn { background: #1A1A18; color: #F2F1EC; }
  body[data-theme="vault"] .share-btn, body[data-theme="holo"] .share-btn { background: #E8EAF0; color: #0A0C10; }
  .share-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(0,0,0,0.25); }
  .share-btn:disabled { opacity: 0.5; cursor: wait; }

  .hint {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    z-index: 100; font-size: 12px; letter-spacing: 0.04em; opacity: 0.55; pointer-events: none;
  }
  body[data-theme="gallery"] .hint { color: #55554F; }
  body[data-theme="vault"] .hint, body[data-theme="holo"] .hint { color: #AAB0C0; }

  /* ============ stage ============ */
  #stage { position: absolute; inset: 72px 24px 40px 24px; }
  .tile {
    position: absolute; overflow: hidden; cursor: pointer;
    transition: opacity 0.22s var(--ease-out), transform 0.2s var(--ease-out),
                box-shadow 0.22s var(--ease-out), filter 0.25s var(--ease-out);
    will-change: transform;
  }
  /* 卡圖填滿成個格：cover + 置中，主要畫面永遠喺格中央 */
  .tile img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center 22%; /* 卡面上半（怪獸畫框）優先 */
    pointer-events: none;
  }
  /* 極致色塊：升 = 純綠、跌 = 純紅，0% = 微灰 */
  .tile .tint { position: absolute; inset: 0; pointer-events: none; z-index: 2; }

  /* spotlight：hover 時全場調暗，得嗰隻卡浮出 */
  #stage:hover .tile:not(:hover),
  #stage:focus-within .tile:not(:hover):not(:focus-visible) {
    opacity: 0.30; filter: saturate(0.35) brightness(0.72);
  }
  .tile:hover, .tile:focus-visible { z-index: 8; }

  /* ---- gallery ---- */
  body[data-theme="gallery"] .tile { background: #DDDAD2; border-radius: 2px; }
  body[data-theme="gallery"] .tile:hover, body[data-theme="gallery"] .tile:focus-visible {
    transform: scale(1.07); box-shadow: 0 18px 48px rgba(40,38,32,0.4);
  }
  /* ---- vault ---- */
  body[data-theme="vault"] .tile { background: #11141B; border-radius: 4px; }
  body[data-theme="vault"] .tile::before {
    content: ""; position: absolute; inset: 0; border-radius: 4px; z-index: 3; pointer-events: none;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
  }
  body[data-theme="vault"] .tile:hover, body[data-theme="vault"] .tile:focus-visible {
    transform: scale(1.07); box-shadow: 0 22px 60px rgba(0,0,0,0.85), 0 0 44px var(--glow-soft, transparent);
  }
  /* ---- holo ---- */
  body[data-theme="holo"] .tile { background: #161923; border-radius: 5px; transform-style: preserve-3d; }
  body[data-theme="holo"] .tile .foil {
    position: absolute; inset: -40%; z-index: 3; pointer-events: none;
    background: linear-gradient(115deg,
      transparent 30%, rgba(255,120,180,0.12) 42%, rgba(140,200,255,0.16) 50%,
      rgba(150,255,200,0.12) 58%, transparent 70%);
    mix-blend-mode: screen;
    transform: translateX(var(--foil-x, -30%)) rotate(8deg);
    transition: transform 0.5s var(--ease-out);
  }
  body[data-theme="holo"] .tile:hover .foil { --foil-x: 30%; }
  body[data-theme="holo"] .tile:hover, body[data-theme="holo"] .tile:focus-visible {
    box-shadow: 0 22px 56px rgba(0,0,0,0.7), 0 0 36px var(--glow-soft, transparent);
  }

  /* ============ hover preview (詳盡資訊只喺呢度出現) ============ */
  #preview {
    position: fixed; z-index: 150; width: 300px; pointer-events: none;
    border-radius: 12px; padding: 16px; opacity: 0; transform: translateY(6px);
    transition: opacity 0.18s var(--ease-out), transform 0.18s var(--ease-out);
    display: flex; gap: 14px;
  }
  #preview.show { opacity: 1; transform: none; }
  body[data-theme="gallery"] #preview { background: rgba(255,255,255,0.96); box-shadow: 0 20px 60px rgba(30,28,22,0.3); color: #1A1A18; }
  body[data-theme="vault"] #preview, body[data-theme="holo"] #preview { background: rgba(20,23,31,0.97); box-shadow: 0 20px 60px rgba(0,0,0,0.7); color: #E8EAF0; }
  #preview img { width: 84px; height: 117px; object-fit: cover; object-position: center 22%; border-radius: 4px; }
  #preview .p-name { font-size: 14px; font-weight: 700; line-height: 1.25; }
  #preview .p-set { font-size: 11px; opacity: 0.6; margin: 2px 0 8px; }
  #preview .p-row { display: flex; justify-content: space-between; font-size: 11.5px; padding: 2px 0; }
  #preview .p-row b { font-variant-numeric: tabular-nums; }
  #preview .p-chg { font-size: 20px; font-weight: 800; margin-top: 6px; }
  #preview .p-chg.up { color: #00C853; } #preview .p-chg.down { color: #FF1744; }

  /* ============ detail modal (click) ============ */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 200; display: none; align-items: center; justify-content: center;
    background: rgba(8,8,12,0); transition: background 0.3s;
  }
  .modal-backdrop.open { display: flex; background: rgba(8,8,12,0.6); backdrop-filter: blur(8px); }
  .modal {
    width: min(760px, 90vw); border-radius: 16px; padding: 30px; position: relative;
    display: flex; gap: 28px; align-items: flex-start;
    transform: translateY(28px) scale(0.95); opacity: 0;
    transition: transform 0.4s var(--ease-spring), opacity 0.3s;
  }
  .modal-backdrop.open .modal { transform: none; opacity: 1; }
  body[data-theme="gallery"] .modal { background: #FFF; box-shadow: 0 34px 90px rgba(30,28,22,0.35); color: #1A1A18; }
  body[data-theme="vault"] .modal, body[data-theme="holo"] .modal { background: #171A22; box-shadow: 0 34px 100px rgba(0,0,0,0.75); color: #E8EAF0; }
  .modal img { width: 210px; border-radius: 8px; }
  .modal h2 { font-size: 22px; margin-bottom: 4px; }
  .modal .sub { font-size: 13px; opacity: 0.6; margin-bottom: 18px; }
  .modal .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 26px; font-size: 12px; }
  .modal .stats span { opacity: 0.6; }
  .modal .stats b { display: block; font-size: 17px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .modal .close { position: absolute; top: 14px; right: 18px; border: 0; background: none; font-size: 22px; cursor: pointer; color: inherit; opacity: 0.5; }
  .modal .close:hover { opacity: 1; }

  /* ============ legend ============ */
  #legend {
    position: fixed; bottom: 34px; left: 50%; transform: translateX(-50%);
    z-index: 100; display: flex; align-items: center; gap: 8px;
    font-size: 11px; letter-spacing: 0.03em; pointer-events: none; font-variant-numeric: tabular-nums;
  }
  #legend .bar { width: 90px; height: 8px; border-radius: 4px; display: inline-block; }
  #legend .bar.down { background: linear-gradient(90deg, #FF1744, rgba(255,23,68,0.05)); }
  #legend .bar.up { background: linear-gradient(90deg, rgba(0,200,83,0.05), #00C853); }
  body[data-theme="gallery"] #legend { color: #55554F; }
  body[data-theme="vault"] #legend, body[data-theme="holo"] #legend { color: #AAB0C0; }

  /* ============ share toast ============ */
  #toast {
    position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%) translateY(10px);
    z-index: 300; padding: 10px 22px; border-radius: 999px; font-size: 13px; font-weight: 600;
    opacity: 0; transition: all 0.3s var(--ease-out); pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translateX(-50%); }
  body[data-theme="gallery"] #toast { background: #1A1A18; color: #F2F1EC; }
  body[data-theme="vault"] #toast, body[data-theme="holo"] #toast { background: #E8EAF0; color: #0A0C10; }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; animation: none !important; }
  }
</style>
</head>
<body data-theme="gallery">

<div class="switcher" role="tablist">
  <button data-theme="gallery" class="active">Gallery</button>
  <button data-theme="vault">Vault</button>
  <button data-theme="holo">Holo</button>
</div>

<button class="share-btn" id="shareBtn">⬇ Share card</button>

<div id="stage"></div>

<div id="legend">
  <span>−15%+</span><i class="bar down"></i><span>0</span><i class="bar up"></i><span>+15%+</span>
</div>
<p class="hint">hover = spotlight & details · click = full card · 1/2/3 = theme · S = share PNG</p>

<div id="preview"></div>

<div class="modal-backdrop" id="backdrop">
  <div class="modal" role="dialog" aria-modal="true">
    <button class="close" id="modalClose">✕</button>
    <img id="mImg" src="" alt="">
    <div>
      <h2 id="mName"></h2>
      <p class="sub" id="mSet"></p>
      <div class="stats">
        <div><span>Market cap</span><b id="mCap"></b></div>
        <div><span>PSA 10 price</span><b id="mPrice"></b></div>
        <div><span>30D change</span><b id="mChg"></b></div>
        <div><span>30D tracked sales</span><b id="mSales"></b></div>
        <div><span>7D change</span><b id="mChg7"></b></div>
        <div><span>PSA 10 population</span><b id="mPop"></b></div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ================= 真實數據 (seed-snapshot top100) ================= */
let cards = [];
const stage = document.getElementById("stage");

/* ================= squarified treemap（大先入位、蛇形填位） ================= */
const TARGET = 0.714, IDEAL = 1 / TARGET;
function worstRatio(areas, side) {
  const rowArea = areas.reduce((a, b) => a + b, 0);
  const t = rowArea / side;
  let worst = 0;
  for (const a of areas) {
    const aspect = (a / t) / t;
    const r = Math.max(aspect, 1 / aspect);
    worst = Math.max(worst, Math.abs(Math.log(r / IDEAL)));
  }
  return worst;
}
function layoutRow(row, rect, scale, tiles) {
  const rowArea = row.reduce((s, c) => s + c.cap * scale, 0);
  if (rect.w >= rect.h) {
    const rw = rowArea / rect.h;
    let ry = rect.y;
    row.forEach((c, i) => {
      const ch = i === row.length - 1 ? rect.y + rect.h - ry : c.cap * scale / rw;
      tiles.push({ c, x: rect.x, y: ry, w: rw, h: ch }); ry += ch;
    });
    rect.x += rw; rect.w -= rw;
  } else {
    const rh = rowArea / rect.w;
    let rx = rect.x;
    row.forEach((c, i) => {
      const cw = i === row.length - 1 ? rect.x + rect.w - rx : c.cap * scale / rh;
      tiles.push({ c, x: rx, y: rect.y, w: cw, h: rh }); rx += cw;
    });
    rect.y += rh; rect.h -= rh;
  }
}
function layout(items, W, H) {
  const sorted = [...items].sort((a, b) => b.cap - a.cap);
  const scale = W * H / sorted.reduce((s, c) => s + c.cap, 0);
  const rect = { x: 0, y: 0, w: W, h: H };
  const tiles = []; let row = []; const queue = [...sorted];
  while (queue.length) {
    const side = Math.min(rect.w, rect.h);
    const areas = row.map(c => c.cap * scale);
    const next = queue[0].cap * scale;
    if (row.length && worstRatio([...areas, next], side) > worstRatio(areas, side)) {
      layoutRow(row, rect, scale, tiles); row = [];
    } else row.push(queue.shift());
  }
  if (row.length) layoutRow(row, rect, scale, tiles);
  return tiles;
}

/* ================= 極致色塊 =================
   0% → 微灰薄霧；±15% → 全場最實純綠/純紅。
   pow(t, 0.75)：細幅都睇到偏向，大幅直接爆色。 */
function tintStyle(chg) {
  if (chg === null || chg === undefined || !isFinite(chg)) {
    return "rgba(128,128,132,0.18)";                 // 冇數據：中性灰
  }
  const t = Math.pow(Math.min(Math.abs(chg), 15) / 15, 0.75);
  const a = 0.08 + t * 0.84;                          // 0.08 → 0.92
  if (chg > 0) return `rgba(0, 200, 83, ${a.toFixed(3)})`;
  if (chg < 0) return `rgba(255, 23, 68, ${a.toFixed(3)})`;
  return "rgba(128,128,132,0.10)";
}
function glowPair(chg) {
  if (chg === null) return ["transparent", "transparent"];
  const t = Math.min(Math.abs(chg), 15) / 15;
  const col = chg > 0 ? "0, 200, 83" : chg < 0 ? "255, 23, 68" : "128,128,132";
  return [`rgba(${col}, ${(0.3 + t * 0.6).toFixed(2)})`, `rgba(${col}, ${(0.12 + t * 0.28).toFixed(2)})`];
}

/* ================= render ================= */
function render() {
  stage.innerHTML = "";
  const rect = stage.getBoundingClientRect();
  layout(cards, rect.width, rect.height).forEach(({ c, x, y, w, h }) => {
    if (w < 10 || h < 10) return;
    const el = document.createElement("div");
    el.className = "tile"; el.tabIndex = 0;
    el.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px;`;
    const [g, gs] = glowPair(c.chg30);
    el.style.setProperty("--glow", g);
    el.style.setProperty("--glow-soft", gs);
    el.innerHTML = `
      <img src="${c.img}" alt="" loading="${c.rank <= 12 ? 'eager' : 'lazy'}"
           onerror="this.onerror=null;this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22438%22 height=%22610%22%3E%3Crect width=%22438%22 height=%22610%22 fill=%22%2322262e%22/%3E%3C/svg%3E'">
      <span class="tint" style="background:${tintStyle(c.chg30)}"></span>
      <span class="foil"></span>`;
    el.addEventListener("pointerenter", () => showPreview(c, el));
    el.addEventListener("pointerleave", hidePreview);
    el.addEventListener("click", () => { hidePreview(); openModal(c); });
    el.addEventListener("pointermove", e => {
      if (document.body.dataset.theme !== "holo") return;
      const b = el.getBoundingClientRect();
      const px = (e.clientX - b.left) / b.width - 0.5;
      const py = (e.clientY - b.top) / b.height - 0.5;
      el.style.transform = `perspective(700px) rotateY(${px * 9}deg) rotateX(${-py * 9}deg) scale(1.07)`;
    });
    el.addEventListener("pointerleave", () => { el.style.transform = ""; });
    stage.appendChild(el);
  });
}

/* ================= hover preview ================= */
const preview = document.getElementById("preview");
const fmt$ = v => v == null ? "—" : "$" + (v >= 1e6 ? (v / 1e6).toFixed(1) + "M" : v >= 1e3 ? (v / 1e3).toFixed(1) + "K" : v.toLocaleString());
const fmtPct = v => v == null ? "—" : (v > 0 ? "+" : "") + v.toFixed(1) + "%";
function showPreview(c, el) {
  const chgCls = c.chg30 > 0 ? "up" : "down";
  preview.innerHTML = `
    <img src="${c.img}" alt="">
    <div style="flex:1;min-width:0">
      <div class="p-name">${c.name}</div>
      <div class="p-set">#${c.rank} · ${c.num} · ${c.tcg}</div>
      <div class="p-row"><span>Market cap</span><b>${fmt$(c.cap)}</b></div>
      <div class="p-row"><span>PSA 10</span><b>${fmt$(c.pricePsa10)}</b></div>
      <div class="p-row"><span>30D sales</span><b>${c.sales30}</b></div>
      <div class="p-chg ${chgCls}">${fmtPct(c.chg30)}</div>
    </div>`;
  const b = el.getBoundingClientRect();
  const pw = 300, ph = 170;
  let px = b.right + 12, py = b.top + b.height / 2 - ph / 2;
  if (px + pw > innerWidth - 12) px = b.left - pw - 12;
  py = Math.max(70, Math.min(innerHeight - ph - 50, py));
  preview.style.left = px + "px"; preview.style.top = py + "px";
  preview.classList.add("show");
}
function hidePreview() { preview.classList.remove("show"); }

/* ================= modal ================= */
const backdrop = document.getElementById("backdrop");
function openModal(c) {
  document.getElementById("mImg").src = c.img;
  document.getElementById("mName").textContent = `#${c.rank} ${c.name}`;
  document.getElementById("mSet").textContent = `${c.num} · ${c.set || c.tcg}`;
  document.getElementById("mCap").textContent = fmt$(c.cap);
  document.getElementById("mPrice").textContent = fmt$(c.pricePsa10);
  const mChg = document.getElementById("mChg");
  mChg.textContent = fmtPct(c.chg30);
  mChg.style.color = c.chg30 > 0 ? "#00C853" : c.chg30 < 0 ? "#FF1744" : "inherit";
  const mChg7 = document.getElementById("mChg7");
  mChg7.textContent = fmtPct(c.chg7);
  mChg7.style.color = c.chg7 > 0 ? "#00C853" : c.chg7 < 0 ? "#FF1744" : "inherit";
  document.getElementById("mSales").textContent = `${c.sales30} · ${fmt$(c.salesValue30)}`;
  document.getElementById("mPop").textContent = c.pop == null ? "—" : c.pop.toLocaleString();
  backdrop.classList.add("open");
}
document.getElementById("modalClose").onclick = () => backdrop.classList.remove("open");
backdrop.addEventListener("mousedown", e => { if (e.target === backdrop) backdrop.classList.remove("open"); });

/* ================= share PNG（1200×630 OG 尺寸，貼群自動預覽） ================= */
async function sharePNG() {
  const btn = document.getElementById("shareBtn");
  btn.disabled = true;
  const W = 1200, H = 630, GAP = 2, HEADER = 84;
  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");
  const dark = document.body.dataset.theme !== "gallery";
  ctx.fillStyle = dark ? "#0A0C10" : "#F2F1EC";
  ctx.fillRect(0, 0, W, H);

  // header: brand only — 圖上唔放數據文字
  ctx.fillStyle = dark ? "#E8EAF0" : "#1A1A18";
  ctx.font = "800 34px -apple-system, 'SF Pro Display', Arial, sans-serif";
  ctx.fillText("CARDZ", 36, 52);
  ctx.fillStyle = "#F5A623";
  const cw = ctx.measureText("CARDZ").width;
  ctx.fillText(" Market Cap", 36 + cw, 52);
  ctx.font = "600 15px -apple-system, Arial, sans-serif";
  ctx.fillStyle = dark ? "rgba(232,234,240,0.5)" : "rgba(26,26,24,0.5)";
  ctx.textAlign = "right";
  ctx.fillText("cardz.markets", W - 36, 50);
  ctx.textAlign = "left";

  const tiles = layout(cards, W - 24, H - HEADER - 20);
  const loadImg = src => new Promise(res => {
    const im = new Image(); im.crossOrigin = "anonymous";
    im.onload = () => res(im); im.onerror = () => res(null);
    im.src = src;
  });
  const imgs = await Promise.all(tiles.map(t => loadImg(t.c.img)));
  tiles.forEach((t, i) => {
    const x = 12 + t.x, y = HEADER + t.y, w = t.w - GAP, h = t.h - GAP;
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    const im = imgs[i];
    if (im) {
      // cover + center 22% — 同 CSS 一致
      const ir = im.width / im.height, tr = w / h;
      let sw, sh, sx, sy;
      if (ir > tr) { sh = im.height; sw = sh * tr; sx = (im.width - sw) / 2; sy = 0; }
      else { sw = im.width; sh = sw / tr; sx = 0; sy = (im.height - sh) * 0.22; }
      ctx.drawImage(im, sx, sy, sw, sh, x, y, w, h);
    } else {
      ctx.fillStyle = dark ? "#161923" : "#DDDAD2";
      ctx.fillRect(x, y, w, h);
    }
    ctx.fillStyle = tintStyle(t.c.chg30);
    ctx.fillRect(x, y, w, h);
    ctx.restore();
  });

  const a = document.createElement("a");
  a.download = `cardz-market-cap-${new Date().toISOString().slice(0, 10)}.png`;
  a.href = canvas.toDataURL("image/png");
  a.click();
  btn.disabled = false;
  const toast = document.getElementById("toast");
  toast.textContent = "PNG saved — paste into any group chat for auto preview";
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2600);
}
document.getElementById("shareBtn").onclick = sharePNG;

/* ================= theme & keys ================= */
function setTheme(t) {
  document.body.dataset.theme = t;
  document.querySelectorAll(".switcher button").forEach(b => b.classList.toggle("active", b.dataset.theme === t));
}
document.querySelectorAll(".switcher button").forEach(b => b.onclick = () => setTheme(b.dataset.theme));
document.addEventListener("keydown", e => {
  if (e.key === "Escape") backdrop.classList.remove("open");
  const map = { "1": "gallery", "2": "vault", "3": "holo" };
  if (map[e.key]) setTheme(map[e.key]);
  if (e.key.toLowerCase() === "s") sharePNG();
});

/* ================= boot ================= */
window.addEventListener("resize", render);
fetch("real-cards.json")
  .then(r => r.json())
  .then(data => { cards = data; render(); });
</script>
