name: cardz-market-cap

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${CARDZ_DB_NAME:-cardz_market_cap}
      MYSQL_USER: ${CARDZ_DB_USER:-cardz}
      MYSQL_PASSWORD: ${CARDZ_DB_PASSWORD:?CARDZ_DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${CARDZ_DB_ROOT_PASSWORD:?CARDZ_DB_ROOT_PASSWORD is required}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:${CARDZ_DB_PORT:-3308}:3306"
    volumes:
      - cardz_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  cardz_mysql:
