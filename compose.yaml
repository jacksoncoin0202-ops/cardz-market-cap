# Production web (app.cardzmarketcap.com)
# Server deploy path: git pull → docker compose up --build
#
# Build context MUST be repo root (npm workspaces + data/public).
#
# seed-snapshot.json 係烘焙入 image（next build 期間 ISR 預渲染就要讀佢）。
# 037 / FE04：box-subset.json 一齊 COPY 入 image，唔寫入 seed。
# market-assets（1.4GB 卡圖）唔烘焙，由下面個 :ro volume 掛入嚟 —— 少咗佢，
# 每次 build 嘅 build cache 由 4.55GB 跌到約 0.3GB（實測）。
# 換數 + restart 就得（volume 蓋過 image 內後備）。FE／lockfile／Dockerfile 變先要 --build。
# 見 scripts/compose_up_needed.sh。BOX 唔寫入 PSA10 seed。

name: cardz-market-cap-web

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        CARDZ_PUBLIC_BUILD_ID: ${CARDZ_PUBLIC_BUILD_ID:-deploy}
    image: cardz-web:latest
    ports:
      - "${CARDZ_WEB_PORT:-3000}:3000"
    environment:
      CARDZ_PUBLIC_BUILD_ID: ${CARDZ_PUBLIC_BUILD_ID:-deploy}
      # robots.ts 讀呢個掣決定開唔開放俾人爬。之前呢度冇傳、亦冇 env_file，所以
      # runtime 永遠係 undefined，即係任何一個用呢份 compose 起嘅環境（包括
      # staging / canary）都行返 production 全開放嗰條分支。
      CARDZ_ENVIRONMENT: ${CARDZ_ENVIRONMENT:-production}
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      MARKET_DATA_SNAPSHOT_PATH: /app/data/public/seed-snapshot.json
    volumes:
      # 卡圖／seed／BOX sidecar／editorial overlay 唔靠 image 內嗰份。冇掛卡圖 /market-assets/* 會 404
      # （/api/health 唔會察覺 —— 佢淨係驗 snapshot 讀唔讀到）。
      - ./data/public/market-assets:/app/data/public/market-assets:ro
      - ./data/public/seed-snapshot.json:/app/data/public/seed-snapshot.json:ro
      - ./data/public/box-subset.json:/app/data/public/box-subset.json:ro
      - ./data/editorial/card-names-by-id.json:/app/data/editorial/card-names-by-id.json:ro
      - ./data/editorial/sealed-stories.json:/app/data/editorial/sealed-stories.json:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
