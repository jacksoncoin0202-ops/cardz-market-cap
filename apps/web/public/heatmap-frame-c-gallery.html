<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CARDZ · Plan C — 暗黑畫廊 · 雙幼線框 · 頂邊色標</title>
<style>
  :root {
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-spring: cubic-bezier(0.32, 0.72, 0, 1);
    --gallery-bg: #0D0E11;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    font-variant-numeric: tabular-nums;
    overflow: hidden;
    background: var(--gallery-bg);
    transition: background-color 0.5s var(--ease-out);
  }

  /* ============ chrome ============ */
  .switcher {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    z-index: 100; display: flex; gap: 6px; padding: 5px; border-radius: 999px;
    background: rgba(20,24,32,0.72);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 2px 24px rgba(0,0,0,0.6);
  }
  .switcher button {
    border: 0; cursor: pointer; font: inherit; font-size: 13px; font-weight: 600;
    padding: 8px 18px; border-radius: 999px; letter-spacing: 0.02em;
    background: transparent; color: #5E6673;
    transition: all 0.25s var(--ease-out);
  }
  .switcher button.active { background: #E8EAF0; color: #0A0C10; }

  .period-switcher {
    position: fixed; top: 16px; left: 24px;
    z-index: 100; display: flex; gap: 2px; padding: 4px; border-radius: 8px;
    background: rgba(20,24,32,0.72);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 2px 24px rgba(0,0,0,0.5);
  }
  .period-switcher button {
    border: 0; cursor: pointer; font: inherit; font-size: 12px; font-weight: 700;
    padding: 7px 14px; border-radius: 5px; letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
    background: transparent; color: #5E6673;
    transition: all 0.2s var(--ease-out);
  }
  .period-switcher button.active { background: #E8EAF0; color: #0A0C10; }
  .period-switcher button:disabled { opacity: 0.35; cursor: default; }
  .period-note {
    position: fixed; top: 58px; left: 28px; z-index: 100; margin: 0;
    font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    color: rgba(232,234,240,0.4);
  }

  .share-btn {
    position: fixed; top: 20px; right: 24px; z-index: 100;
    border: 0; cursor: pointer; font: inherit; font-size: 13px; font-weight: 700;
    padding: 10px 20px; border-radius: 999px; letter-spacing: 0.02em;
    transition: all 0.25s var(--ease-out);
    display: flex; align-items: center; gap: 8px;
    background: #E8EAF0; color: #0A0C10;
  }
  .share-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
  .share-btn:disabled { opacity: 0.5; cursor: wait; }

  .tune-toggle {
    position: fixed; top: 16px; right: 168px; z-index: 301;
    border: 0; cursor: pointer; font: inherit; font-size: 12px; font-weight: 700;
    padding: 10px 16px; border-radius: 999px; letter-spacing: 0.06em;
    transition: all 0.25s var(--ease-out);
    background: rgba(20,24,32,0.72); color: #E8EAF0; box-shadow: 0 2px 24px rgba(0,0,0,0.5);
  }

  .hint {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    z-index: 100; font-size: 12px; letter-spacing: 0.04em; opacity: 0.55; pointer-events: none;
    color: #AAB0C0;
  }

  /* ============ stage · 暗黑畫廊雙幼線框 ============
     設計語言：最小干預。畫面本身好靜，數據靠三個層次表達：
       1. 外框 = 1px 幼線，色 = 升/跌色；透明度 0.18 → 1.0 隨 |chg|（最勁嗰啲框會「著燈」）
       2. 內框 = 第二條 1px 幼線，同色系但更淡（0.5×）— 雙線係畫廊裝裱嘅 signature
       3. 頂邊 = 卡圖上緣一條 3px 色帶，由左至右 fade，強者先出現 — 一眼掃到邊排勁
       4. 卡圖自帶向中心嘅暗角漸層，強者暗角帶同色光暈（漸變向中心）
  */
  #stage { position: absolute; inset: 72px 24px 40px 24px; }
  .tile {
    position: absolute; overflow: visible; cursor: pointer;
    transition: opacity 0.22s var(--ease-out), transform 0.2s var(--ease-out),
                box-shadow 0.22s var(--ease-out), filter 0.25s var(--ease-out);
    will-change: transform;
  }
  .tile .frame {
    position: absolute; inset: var(--gap-inset, 1px); z-index: 1;
    border: 1px solid var(--frame-color, rgba(150,150,160,0.2));
    border-radius: 3px;
    background: #121419;
    box-shadow:
      0 12px 30px rgba(0, 0, 0, 0.45),
      0 0 var(--halo-blur, 0px) var(--halo, transparent);
    pointer-events: none;
  }
  /* 內線（雙線框嘅第二條） */
  .tile .frame::after {
    content: ""; position: absolute; inset: 4px; z-index: 1; pointer-events: none;
    border: 1px solid var(--frame-inner, transparent);
    border-radius: 1px;
  }
  .tile .art {
    position: absolute; z-index: 2;
    inset: calc(var(--gap-inset, 1px) + var(--mat, 7px));
    overflow: hidden; border-radius: 2px;
    pointer-events: none;
  }
  .tile .art img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center 22%;
    filter: blur(var(--card-blur, 0px)) saturate(0.9) brightness(0.96);
  }
  /* 向中心漸變：暗角 + 強者同色光暈滲入 */
  .tile .art .vign {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background:
      radial-gradient(85% 85% at 50% 50%, transparent 55%, rgba(5, 6, 9, 0.42) 100%),
      radial-gradient(80% 80% at 50% 50%, var(--core, transparent) 0%, transparent 62%);
  }
  /* 頂邊色標 */
  .tile .art .edge {
    position: absolute; top: 0; left: 0; right: 0; height: var(--edge-h, 0px); z-index: 3;
    background: linear-gradient(90deg, var(--edge-color, transparent), transparent 85%);
    pointer-events: none;
  }
  .tile .art .tint { position: absolute; inset: 0; z-index: 1; }

  .tile .bigpct {
    position: absolute; left: calc(var(--gap-inset, 1px) + var(--mat, 7px) + 6px);
    bottom: calc(var(--gap-inset, 1px) + var(--mat, 7px) + 5px);
    z-index: 4; pointer-events: none;
    font-size: 13px; font-weight: 800; letter-spacing: 0.01em;
    font-variant-numeric: tabular-nums; color: #FFD54A;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85), 0 0 12px rgba(0, 0, 0, 0.5);
  }

  /* spotlight */
  #stage:hover .tile:not(:hover),
  #stage:focus-within .tile:not(:hover):not(:focus-visible) {
    opacity: 0.30; filter: saturate(0.35) brightness(0.72);
  }
  .tile:hover, .tile:focus-visible {
    z-index: 8;
    transform: scale(1.07);
    box-shadow: 0 22px 60px rgba(0,0,0,0.85), 0 0 44px var(--glow-soft, transparent);
  }

  /* ============ tune panel ============ */
  .tune-panel {
    position: fixed; top: 62px; right: 16px; z-index: 300;
    width: 272px; max-height: calc(100vh - 100px); overflow-y: auto;
    border-radius: 14px; padding: 16px 16px 12px;
    font-size: 11px; letter-spacing: 0.03em;
    opacity: 0; transform: translateX(16px); pointer-events: none;
    transition: opacity 0.25s var(--ease-out), transform 0.25s var(--ease-out);
    background: rgba(20,23,31,0.96); box-shadow: 0 18px 50px rgba(0,0,0,0.65); color: #E8EAF0;
  }
  .tune-panel.open { opacity: 1; transform: none; pointer-events: auto; }
  .tune-panel h3 { font-size: 10px; font-weight: 800; letter-spacing: 0.22em; text-transform: uppercase; opacity: 0.5; margin-bottom: 10px; }
  .tune-panel h4 { font-size: 9px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.38; margin: 14px 0 2px; border-top: 1px solid rgba(128,128,128,0.22); padding-top: 10px; }
  .tune-row { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
  .tune-row label { width: 96px; flex: none; font-weight: 600; opacity: 0.75; }
  .tune-row input[type="range"] { flex: 1; accent-color: #FFD54A; height: 18px; }
  .tune-row .val { width: 40px; text-align: right; font-variant-numeric: tabular-nums; opacity: 0.85; flex: none; }
  .tune-row input[type="number"] {
    width: 56px; font: inherit; font-variant-numeric: tabular-nums;
    border: 1px solid rgba(128,128,128,0.35); border-radius: 5px; padding: 3px 6px; background: transparent; color: inherit;
  }
  .tune-row input[type="color"] {
    width: 30px; height: 22px; border: 1px solid rgba(128,128,128,0.35); border-radius: 5px;
    padding: 0 2px; background: transparent; cursor: pointer; flex: none;
  }
  .tune-row .hex { width: 62px; font: inherit; font-size: 10px; font-variant-numeric: tabular-nums;
    border: 1px solid rgba(128,128,128,0.35); border-radius: 5px; padding: 3px 6px; background: transparent; color: inherit; }
  .tune-actions { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
  .tune-actions button {
    flex: 1; min-width: 70px; border: 1px solid rgba(128,128,128,0.4); cursor: pointer;
    font: inherit; font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
    padding: 7px 4px; border-radius: 7px; background: transparent; color: inherit;
    transition: all 0.2s;
  }
  .tune-actions button:hover { background: #E8EAF0; color: #0A0C10; border-color: #E8EAF0; }

  /* ============ preview / modal / legend / toast ============ */
  #preview {
    position: fixed; z-index: 150; width: 300px; pointer-events: none;
    border-radius: 12px; padding: 16px; opacity: 0; transform: translateY(6px);
    transition: opacity 0.18s var(--ease-out), transform 0.18s var(--ease-out);
    display: flex; gap: 14px;
    background: rgba(20,23,31,0.97); box-shadow: 0 20px 60px rgba(0,0,0,0.7); color: #E8EAF0;
  }
  #preview.show { opacity: 1; transform: none; }
  #preview img { width: 84px; height: 117px; object-fit: cover; object-position: center 22%; border-radius: 4px; }
  #preview .p-name { font-size: 14px; font-weight: 700; line-height: 1.25; }
  #preview .p-set { font-size: 11px; opacity: 0.6; margin: 2px 0 8px; }
  #preview .p-row { display: flex; justify-content: space-between; font-size: 11.5px; padding: 2px 0; }
  #preview .p-row b { font-variant-numeric: tabular-nums; }
  #preview .p-chg { font-size: 20px; font-weight: 800; margin-top: 6px; }
  #preview .p-chg.up { color: #2FA37C; } #preview .p-chg.down { color: #B84A6E; }

  .modal-backdrop {
    position: fixed; inset: 0; z-index: 200; display: none; align-items: center; justify-content: center;
    background: rgba(8,8,12,0); transition: background 0.3s;
  }
  .modal-backdrop.open { display: flex; background: rgba(8,8,12,0.65); backdrop-filter: blur(8px); }
  .modal {
    width: min(760px, 90vw); border-radius: 16px; padding: 30px; position: relative;
    display: flex; gap: 28px; align-items: flex-start;
    transform: translateY(28px) scale(0.95); opacity: 0;
    transition: transform 0.4s var(--ease-spring), opacity 0.3s;
    background: #171A22; box-shadow: 0 34px 100px rgba(0,0,0,0.75); color: #E8EAF0;
  }
  .modal-backdrop.open .modal { transform: none; opacity: 1; }
  .modal img { width: 210px; border-radius: 8px; }
  .modal h2 { font-size: 22px; margin-bottom: 4px; }
  .modal .sub { font-size: 13px; opacity: 0.6; margin-bottom: 18px; }
  .modal .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 26px; font-size: 12px; }
  .modal .stats span { opacity: 0.6; }
  .modal .stats b { display: block; font-size: 17px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .modal .close { position: absolute; top: 14px; right: 18px; border: 0; background: none; font-size: 22px; cursor: pointer; color: inherit; opacity: 0.5; }
  .modal .close:hover { opacity: 1; }

  #legend {
    position: fixed; bottom: 34px; left: 50%; transform: translateX(-50%);
    z-index: 100; display: flex; align-items: center; gap: 8px;
    font-size: 11px; letter-spacing: 0.03em; pointer-events: none; font-variant-numeric: tabular-nums;
    color: #AAB0C0;
  }
  #legend .bar { width: 90px; height: 8px; border-radius: 4px; display: inline-block; }

  #toast {
    position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%) translateY(10px);
    z-index: 300; padding: 10px 22px; border-radius: 999px; font-size: 13px; font-weight: 600;
    opacity: 0; transition: all 0.3s var(--ease-out); pointer-events: none;
    background: #E8EAF0; color: #0A0C10;
  }
  #toast.show { opacity: 1; transform: translateX(-50%); }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; animation: none !important; }
  }
</style>

<script>
let cards = [];
let period = "chg30";
const PERIOD_LABEL = { chg1: "1D", chg7: "7D", chg30: "30D" };
const PERIOD_DESC = { chg1: "24-hour window", chg7: "7-day window", chg30: "30-day window" };
const stage = document.getElementById("stage");

/* ================= squarified treemap ================= */
const TARGET = 0.714, IDEAL = 1 / TARGET;
function worstRatio(areas, side) {
  const rowArea = areas.reduce((a, b) => a + b, 0);
  const t = rowArea / side;
  let worst = 0;
  for (const a of areas) {
    const aspect = (a / t) / t;
    const r = Math.max(aspect, 1 / aspect);
    worst = Math.max(worst, Math.abs(Math.log(r / IDEAL)));
  }
  return worst;
}
function layoutRow(row, rect, scale, tiles) {
  const rowArea = row.reduce((s, c) => s + c.cap * scale, 0);
  if (rect.w >= rect.h) {
    const rw = rowArea / rect.h;
    let ry = rect.y;
    row.forEach((c, i) => {
      const ch = i === row.length - 1 ? rect.y + rect.h - ry : c.cap * scale / rw;
      tiles.push({ c, x: rect.x, y: ry, w: rw, h: ch }); ry += ch;
    });
    rect.x += rw; rect.w -= rw;
  } else {
    const rh = rowArea / rect.w;
    let rx = rect.x;
    row.forEach((c, i) => {
      const cw = i === row.length - 1 ? rect.x + rect.w - rx : c.cap * scale / rh;
      tiles.push({ c, x: rx, y: rect.y, w: cw, h: rh }); rx += cw;
    });
    rect.y += rh; rect.h -= rh;
  }
}
function layout(items, W, H) {
  const sorted = [...items].sort((a, b) => b.cap - a.cap);
  const scale = W * H / sorted.reduce((s, c) => s + c.cap, 0);
  const rect = { x: 0, y: 0, w: W, h: H };
  const tiles = []; let row = []; const queue = [...sorted];
  while (queue.length) {
    const side = Math.min(rect.w, rect.h);
    const areas = row.map(c => c.cap * scale);
    const next = queue[0].cap * scale;
    if (row.length && worstRatio([...areas, next], side) > worstRatio(areas, side)) {
      layoutRow(row, rect, scale, tiles); row = [];
    } else row.push(queue.shift());
  }
  if (row.length) layoutRow(row, rect, scale, tiles);
  return tiles;
}

/* ================= 全域調節參數 ================= */
const CFG = {
  count: 100, badgeCount: 20,
  up: "#2FA37C", down: "#B84A6E", neutral: "#6E7278", badge: "#FFD54A",
  clamp: 5, aMin: 0.05, aMax: 1.0, gamma: 2.0,
  haloMax: 0.5, edge: 6, mat: 2, gap: 3, blur: 0,
};
function hexToRgb(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec((hex || "").trim());
  if (!m) return null;
  const n = parseInt(m[1], 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function strength(chg) {
  if (chg === null || chg === undefined || !isFinite(chg) || chg === 0) return 0;
  return Math.pow(Math.min(Math.abs(chg), CFG.clamp) / CFG.clamp, CFG.gamma);
}
function chgColor(chg) {
  if (chg > 0) return CFG.up;
  if (chg < 0) return CFG.down;
  return CFG.neutral;
}
function rgba(hex, a) {
  const [r, g, b] = hexToRgb(hex) || [128, 128, 132];
  return `rgba(${r},${g},${b},${a.toFixed(3)})`;
}
/* 外框線：0.18 → 1.0 透明度 */
function frameColor(chg) {
  const t = strength(chg);
  return rgba(chgColor(chg), CFG.aMin + t * (CFG.aMax - CFG.aMin));
}
/* 內線：外框嘅 0.5 倍 */
function frameInner(chg) {
  const t = strength(chg);
  return rgba(chgColor(chg), (CFG.aMin + t * (CFG.aMax - CFG.aMin)) * 0.45);
}
/* 中心光暈（漸變向中心） */
function coreGlow(chg) {
  const t = strength(chg);
  return rgba(chgColor(chg), t * CFG.haloMax);
}
function haloSoft(chg) {
  const t = strength(chg);
  return rgba(chgColor(chg), 0.10 + t * 0.30);
}
function tintStyle(chg) {
  const t = strength(chg);
  if (chg === null || chg === undefined || !isFinite(chg)) return rgba(CFG.neutral, 0.08);
  if (chg === 0) return rgba(CFG.neutral, 0.05);
  return rgba(chgColor(chg), 0.03 + t * 0.12);
}

/* ================= render ================= */
function render() {
  stage.innerHTML = "";
  const rect = stage.getBoundingClientRect();
  const shown = cards.slice(0, CFG.count);
  const topBadge = new Set(shown.slice(0, CFG.badgeCount).map(c => c.rank));
  layout(shown, rect.width, rect.height).forEach(({ c, x, y, w, h }) => {
    if (w < 10 || h < 10) return;
    const el = document.createElement("div");
    el.className = "tile"; el.tabIndex = 0;
    el.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px;`;
    const chg = c[period];
    const t = strength(chg);
    const shortSide = Math.min(w, h);
    const matPx = Math.max(4, shortSide * CFG.mat / 100);
    el.style.setProperty("--gap-inset", CFG.gap + "px");
    el.style.setProperty("--mat", matPx.toFixed(1) + "px");
    el.style.setProperty("--frame-color", frameColor(chg));
    el.style.setProperty("--frame-inner", frameInner(chg));
    el.style.setProperty("--core", coreGlow(chg));
    el.style.setProperty("--halo", rgba(chgColor(chg), t * 0.35));
    el.style.setProperty("--halo-blur", (t * 26).toFixed(0) + "px");
    el.style.setProperty("--glow-soft", haloSoft(chg));
    el.style.setProperty("--edge-color", rgba(chgColor(chg), 0.35 + t * 0.65));
    el.style.setProperty("--edge-h", (t > 0.02 ? CFG.edge : 0) + "px");
    el.style.setProperty("--card-blur", CFG.blur + "px");
    const badge = topBadge.has(c.rank) && chg != null
      ? `<span class="bigpct" style="color:${CFG.badge}">${chg > 0 ? "+" : ""}${chg.toFixed(1)}%</span>`
      : "";
    el.innerHTML = `
      <div class="frame"></div>
      <div class="art">
        <img src="${c.img}" alt="" loading="eager"
             onerror="this.onerror=null;this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22438%22 height=%22610%22%3E%3Crect width=%22438%22 height=%22610%22 fill=%22%2322262e%22/%3E%3C/svg%3E'">
        <span class="tint" style="background:${tintStyle(chg)}"></span>
        <span class="vign"></span>
        <span class="edge"></span>
      </div>
      ${badge}`;
    el.addEventListener("pointerenter", () => showPreview(c, el));
    el.addEventListener("pointerleave", hidePreview);
    el.addEventListener("click", () => { hidePreview(); openModal(c); });
    stage.appendChild(el);
  });

  document.getElementById("legendCount").textContent = `· TOP ${shown.length}`;
  document.getElementById("legendLo").textContent = `−${CFG.clamp}%+`;
  document.getElementById("legendHi").textContent = `+${CFG.clamp}%+`;
  document.getElementById("barDown").style.background =
    `linear-gradient(90deg, ${CFG.down}, ${frameColor(-0.0001)})`;
  document.getElementById("barUp").style.background =
    `linear-gradient(90deg, ${frameColor(0.0001)}, ${CFG.up})`;
}

/* ================= hover preview ================= */
const preview = document.getElementById("preview");
const fmt$ = v => v == null ? "—" : "$" + (v >= 1e6 ? (v / 1e6).toFixed(1) + "M" : v >= 1e3 ? (v / 1e3).toFixed(1) + "K" : v.toLocaleString());
const fmtPct = v => v == null ? "—" : (v > 0 ? "+" : "") + v.toFixed(1) + "%";
function showPreview(c, el) {
  const chg = c[period];
  const chgCls = chg > 0 ? "up" : "down";
  preview.innerHTML = `
    <img src="${c.img}" alt="">
    <div style="flex:1;min-width:0">
      <div class="p-name">${c.name}</div>
      <div class="p-set">#${c.rank} · ${c.num} · ${c.tcg}</div>
      <div class="p-row"><span>Market cap</span><b>${fmt$(c.cap)}</b></div>
      <div class="p-row"><span>PSA 10</span><b>${fmt$(c.pricePsa10)}</b></div>
      <div class="p-row"><span>30D sales</span><b>${c.sales30}</b></div>
      <div class="p-chg ${chgCls}">${fmtPct(chg)} <span style="font-size:11px;opacity:0.55;font-weight:600">${PERIOD_LABEL[period]}</span></div>
    </div>`;
  const b = el.getBoundingClientRect();
  const pw = 300, ph = 170;
  let px = b.right + 12, py = b.top + b.height / 2 - ph / 2;
  if (px + pw > innerWidth - 12) px = b.left - pw - 12;
  py = Math.max(70, Math.min(innerHeight - ph - 50, py));
  preview.style.left = px + "px"; preview.style.top = py + "px";
  preview.classList.add("show");
}
function hidePreview() { preview.classList.remove("show"); }

/* ================= modal ================= */
const backdrop = document.getElementById("backdrop");
function openModal(c) {
  document.getElementById("mImg").src = c.img;
  document.getElementById("mName").textContent = `#${c.rank} ${c.name}`;
  document.getElementById("mSet").textContent = `${c.num} · ${c.set || c.tcg}`;
  document.getElementById("mCap").textContent = fmt$(c.cap);
  document.getElementById("mPrice").textContent = fmt$(c.pricePsa10);
  const mChg = document.getElementById("mChg");
  mChg.textContent = fmtPct(c.chg30);
  mChg.style.color = c.chg30 > 0 ? CFG.up : c.chg30 < 0 ? CFG.down : "inherit";
  const mChg1 = document.getElementById("mChg1");
  mChg1.parentElement.style.display = c.chg1 == null ? "none" : "";
  mChg1.textContent = fmtPct(c.chg1);
  mChg1.style.color = c.chg1 > 0 ? CFG.up : c.chg1 < 0 ? CFG.down : "inherit";
  const mChg7 = document.getElementById("mChg7");
  mChg7.parentElement.style.display = c.chg7 == null ? "none" : "";
  mChg7.textContent = fmtPct(c.chg7);
  mChg7.style.color = c.chg7 > 0 ? CFG.up : c.chg7 < 0 ? CFG.down : "inherit";
  document.getElementById("mSales").textContent = `${c.sales30} · ${fmt$(c.salesValue30)}`;
  document.getElementById("mPop").textContent = c.pop == null ? "—" : c.pop.toLocaleString();
  backdrop.classList.add("open");
}
document.getElementById("modalClose").onclick = () => backdrop.classList.remove("open");
backdrop.addEventListener("mousedown", e => { if (e.target === backdrop) backdrop.classList.remove("open"); });

/* ================= share PNG — 暗黑畫廊版 ================= */
async function sharePNG() {
  const btn = document.getElementById("shareBtn");
  btn.disabled = true;

  const W = 1600, H = 1000;
  const PAPER = 48, FRAME_INSET = 12;
  const FX = PAPER + FRAME_INSET;
  const FY = PAPER + FRAME_INSET + 62;
  const FW = W - FX * 2;
  const FH = H - FY - PAPER - FRAME_INSET - 52;

  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");

  const asOf = (cards[0] && cards[0].asOf) ? cards[0].asOf.slice(0, 10) : new Date().toISOString().slice(0, 10);

  ctx.fillStyle = "#0D0E11";
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = "#E8EAF0";
  ctx.font = "800 30px -apple-system, 'SF Pro Display', Arial, sans-serif";
  ctx.fillText("CARDZ", FX, PAPER + 6);
  const cw = ctx.measureText("CARDZ").width;
  ctx.fillStyle = "#6E7278";
  ctx.font = "300 30px -apple-system, 'SF Pro Display', Arial, sans-serif";
  ctx.fillText(" MARKET CAP", FX + cw, PAPER + 6);
  const mw = ctx.measureText(" MARKET CAP").width;

  const plabel = PERIOD_LABEL[period];
  ctx.font = "700 14px -apple-system, Arial, sans-serif";
  const pw = ctx.measureText(plabel).width;
  const px = FX + cw + mw + 16;
  ctx.strokeStyle = "#E8EAF0"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(px, PAPER - 16, pw + 18, 24, 12); ctx.stroke();
  ctx.fillStyle = "#E8EAF0";
  ctx.fillText(plabel, px + 9, PAPER + 1);

  ctx.textAlign = "right";
  ctx.font = "500 14px -apple-system, Arial, sans-serif";
  ctx.fillStyle = "rgba(232,234,240,0.6)";
  ctx.fillText("As of " + asOf, W - FX, PAPER + 5);
  ctx.textAlign = "left";

  ctx.strokeStyle = "#E8EAF0"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(FX, PAPER + 22); ctx.lineTo(FX + 120, PAPER + 22); ctx.stroke();

  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,0.5)"; ctx.shadowBlur = 16; ctx.shadowOffsetY = 4;
  ctx.fillStyle = "#101218";
  ctx.fillRect(FX, FY, FW, FH);
  ctx.restore();

  const shown = cards.slice(0, CFG.count);
  const tiles = layout(shown, FW, FH);
  const topBadge = new Set(shown.slice(0, CFG.badgeCount).map(c => c.rank));
  const loadImg = src => new Promise(res => {
    const im = new Image(); im.crossOrigin = "anonymous";
    im.onload = () => res(im); im.onerror = () => res(null);
    im.src = src;
  });
  const imgs = await Promise.all(tiles.map(t => loadImg(t.c.img)));

  tiles.forEach((t, i) => {
    const GAP = CFG.gap;
    const x = FX + t.x + GAP / 2, y = FY + t.y + GAP / 2, w = t.w - GAP, h = t.h - GAP;
    if (w < 8 || h < 8) return;
    const chg = t.c[period];
    const st = strength(chg);
    const matPx = Math.max(4, Math.min(w, h) * CFG.mat / 100);

    /* 框底 */
    ctx.fillStyle = "#121419";
    ctx.fillRect(x, y, w, h);

    /* 卡圖 + 暗角 + 中心光暈 */
    const ax = x + matPx, ay = y + matPx, aw = w - matPx * 2, ah = h - matPx * 2;
    if (aw > 4 && ah > 4) {
      ctx.save();
      ctx.beginPath(); ctx.rect(ax, ay, aw, ah); ctx.clip();
      const im = imgs[i];
      if (im) {
        const ir = im.width / im.height, tr = aw / ah;
        let sw, sh, sx, sy;
        if (ir > tr) { sh = im.height; sw = sh * tr; sx = (im.width - sw) / 2; sy = 0; }
        else { sw = im.width; sh = sw / tr; sx = 0; sy = (im.height - sh) * 0.22; }
        ctx.drawImage(im, sx, sy, sw, sh, ax, ay, aw, ah);
      } else {
        ctx.fillStyle = "#1A1D24"; ctx.fillRect(ax, ay, aw, ah);
      }
      ctx.fillStyle = tintStyle(chg);
      ctx.fillRect(ax, ay, aw, ah);
      /* 中心光暈（向中心漸變） */
      const cg = ctx.createRadialGradient(ax + aw/2, ay + ah/2, 0, ax + aw/2, ay + ah/2, Math.max(aw, ah) * 0.56);
      cg.addColorStop(0, coreGlow(chg));
      cg.addColorStop(0.62, "rgba(0,0,0,0)");
      ctx.fillStyle = cg;
      ctx.fillRect(ax, ay, aw, ah);
      /* 暗角 */
      const vg = ctx.createRadialGradient(ax + aw/2, ay + ah/2, Math.min(aw, ah) * 0.3, ax + aw/2, ay + ah/2, Math.max(aw, ah) * 0.72);
      vg.addColorStop(0, "rgba(5,6,9,0)");
      vg.addColorStop(1, "rgba(5,6,9,0.42)");
      ctx.fillStyle = vg;
      ctx.fillRect(ax, ay, aw, ah);
      ctx.restore();

      /* 頂邊色標 */
      if (st > 0.02) {
        const eh = CFG.edge;
        const eg = ctx.createLinearGradient(ax, ay, ax + aw * 0.85, ay);
        eg.addColorStop(0, rgba(chgColor(chg), 0.35 + st * 0.65));
        eg.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = eg;
        ctx.fillRect(ax, ay, aw, eh);
      }

      if (topBadge.has(t.c.rank) && chg != null) {
        const label = (chg > 0 ? "+" : "") + chg.toFixed(1) + "%";
        ctx.font = "800 15px -apple-system, 'SF Pro Display', Arial, sans-serif";
        ctx.shadowColor = "rgba(0,0,0,0.85)"; ctx.shadowBlur = 6;
        ctx.fillStyle = CFG.badge;
        ctx.fillText(label, ax + 7, ay + ah - 8);
        ctx.shadowBlur = 0;
      }
    }

    /* 雙幼線框 */
    ctx.strokeStyle = frameColor(chg);
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    ctx.strokeStyle = frameInner(chg);
    ctx.strokeRect(x + 4.5, y + 4.5, w - 9, h - 9);
  });

  ctx.strokeStyle = "rgba(232,234,240,0.4)"; ctx.lineWidth = 1;
  ctx.strokeRect(FX, FY, FW, FH);
  const corners = [[FX, FY], [FX + FW, FY], [FX, FY + FH], [FX + FW, FY + FH]];
  ctx.beginPath();
  corners.forEach(([cx, cy]) => {
    ctx.moveTo(cx - 5, cy); ctx.lineTo(cx + 5, cy);
    ctx.moveTo(cx, cy - 5); ctx.lineTo(cx, cy + 5);
  });
  ctx.stroke();

  const perfY = FY + FH + 18;
  const perfW = 9, perfH = 13, perfGap = 22;
  const perfEnd = W - FX - 76;
  const perfCount = Math.floor((perfEnd - FX) / perfGap);
  ctx.fillStyle = "rgba(232,234,240,0.5)";
  for (let i = 0; i < perfCount; i++) {
    const px2 = FX + i * perfGap;
    ctx.beginPath(); ctx.roundRect(px2, perfY, perfW, perfH, 2); ctx.fill();
  }

  const qrSize = 56, qrX = W - FX - qrSize, qrY = FY + FH + 8;
  ctx.strokeStyle = "#6E7278"; ctx.lineWidth = 1;
  ctx.setLineDash([4, 3]);
  ctx.strokeRect(qrX, qrY, qrSize, qrSize);
  ctx.setLineDash([]);
  ctx.fillStyle = "#6E7278";
  ctx.font = "600 11px -apple-system, Arial, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("QR", qrX + qrSize / 2, qrY + qrSize / 2 + 4);
  ctx.fillText("cardz.io", qrX + qrSize / 2, qrY + qrSize + 15);
  ctx.textAlign = "left";

  ctx.font = "600 10px -apple-system, Arial, sans-serif";
  ctx.fillStyle = "rgba(232,234,240,0.55)";
  const desc = `PSA 10  ·  TOP ${shown.length}  ·  ${PERIOD_DESC[period].toUpperCase()}  ·  AS OF ${asOf.toUpperCase()}`;
  let dx = FX;
  for (const ch of desc) {
    ctx.fillText(ch, dx, perfY + perfH + 18);
    dx += ctx.measureText(ch).width + 2.2;
  }

  ctx.font = "400 9px -apple-system, Arial, sans-serif";
  ctx.fillStyle = "rgba(232,234,240,0.38)";
  ctx.textAlign = "right";
  ctx.fillText(`N° ${asOf.replace(/-/g, '')} / ${shown.length}`, W - FX + 4, FY - 16);
  ctx.textAlign = "left";

  const a = document.createElement("a");
  a.download = `cardz-market-cap-${PERIOD_LABEL[period].toLowerCase()}-${asOf}.png`;
  a.href = canvas.toDataURL("image/png");
  a.click();
  btn.disabled = false;
  const toast = document.getElementById("toast");
  toast.textContent = "PNG 已儲存 — 貼落任何群組會自動預覽";
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2600);
}
document.getElementById("shareBtn").onclick = sharePNG;

/* ================= TUNE 面板 ================= */
const tunePanel = document.getElementById("tunePanel");
function showToast(msg) {
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove("show"), 2400);
}
function bindRange(rangeId, valId, key, fmt) {
  const el = document.getElementById(rangeId);
  const out = valId ? document.getElementById(valId) : null;
  el.addEventListener("input", () => {
    CFG[key] = parseFloat(el.value);
    if (out) out.textContent = fmt ? fmt(CFG[key]) : CFG[key];
    render();
  });
}
function bindColor(colorId, hexId, key) {
  const c = document.getElementById(colorId);
  const h = document.getElementById(hexId);
  const apply = v => {
    if (!hexToRgb(v)) return;
    CFG[key] = v.toUpperCase();
    c.value = CFG[key];
    if (h.value.toUpperCase() !== CFG[key]) h.value = CFG[key];
    render();
  };
  c.addEventListener("input", () => apply(c.value));
  h.addEventListener("change", () => apply(h.value));
}
function initTune() {
  document.getElementById("tuneToggle").onclick = () => tunePanel.classList.toggle("open");
  const cntR = document.getElementById("tCount"), cntN = document.getElementById("tCountN");
  const setCount = v => {
    CFG.count = Math.max(1, Math.min(cards.length || 100, Math.round(v)));
    cntR.value = CFG.count; cntN.value = CFG.count;
    render();
  };
  cntR.addEventListener("input", () => setCount(cntR.value));
  cntN.addEventListener("change", () => setCount(cntN.value));

  bindColor("tUp", "tUpHex", "up");
  bindColor("tDown", "tDownHex", "down");
  bindColor("tNeutral", "tNeutralHex", "neutral");
  bindColor("tBadge", "tBadgeHex", "badge");

  bindRange("tClamp", "tClampV", "clamp");
  bindRange("tAMin", "tAMinV", "aMin", v => v.toFixed(2));
  bindRange("tAMax", "tAMaxV", "aMax", v => v.toFixed(2));
  bindRange("tGamma", "tGammaV", "gamma", v => v.toFixed(2));
  bindRange("tHalo", "tHaloV", "haloMax", v => v.toFixed(2));
  bindRange("tEdge", "tEdgeV", "edge", v => v.toFixed(1));
  bindRange("tMat", "tMatV", "mat", v => v.toFixed(1));
  bindRange("tGap", "tGapV", "gap");
  bindRange("tBadges", "tBadgesV", "badgeCount");

  document.getElementById("tCopy").onclick = async () => {
    const json = JSON.stringify(CFG, null, 1);
    try { await navigator.clipboard.writeText(json); showToast("設定已複製 — 貼落群組就可以拍板"); }
    catch { showToast(json); }
  };
}

/* ================= 期間切換 ================= */
document.querySelectorAll(".period-switcher button").forEach(b => b.onclick = () => {
  if (b.disabled) return;
  period = b.dataset.period;
  document.querySelectorAll(".period-switcher button").forEach(x => x.classList.toggle("active", x === b));
  render();
});
function initPeriods() {
  const btns = [...document.querySelectorAll(".period-switcher button")];
  const hasData = p => cards.some(c => c[p] != null);
  let firstAvail = null;
  btns.forEach(b => {
    const ok = hasData(b.dataset.period);
    b.disabled = !ok;
    if (ok && !firstAvail) firstAvail = b;
  });
  if (!hasData(period) && firstAvail) {
    period = firstAvail.dataset.period;
    btns.forEach(x => x.classList.toggle("active", x === firstAvail));
  }
  const missing = btns.filter(b => b.disabled).map(b => b.textContent);
  document.getElementById("periodNote").textContent =
    missing.length ? `${missing.join(" · ")} collecting — ${btns.filter(b => !b.disabled).map(b => b.textContent).join(" · ")} live` : "";
}
document.addEventListener("keydown", e => {
  if (e.target.matches("input, textarea")) return;
  if (e.key === "Escape") { backdrop.classList.remove("open"); tunePanel.classList.remove("open"); }
  if (e.key.toLowerCase() === "t") tunePanel.classList.toggle("open");
  if (e.key.toLowerCase() === "s") sharePNG();
});

/* ================= boot ================= */
window.addEventListener("resize", render);
fetch("real-cards.json")
  .then(r => r.json())
  .then(data => {
    cards = data;
    initPeriods(); initTune(); render();
    cards.forEach(c => { const im = new Image(); im.src = c.img; });
  });
</script>
